                e.changedTouches

            ) {


                if (

                    touch.identifier ===

                    aimTouch

                ) {


                    aimTouch =

                        null;

                }

            }

        }

    );


    // FIRE START

    const fireButton =

        document.getElementById(

            "fire"

        );


    fireButton.addEventListener(

        "touchstart",

        function(e) {


            e.preventDefault();


            firing = true;


            shoot();

        },

        { passive: false }

    );


    // FIRE END

    fireButton.addEventListener(

        "touchend",

        function() {


            firing = false;

        }

    );


    fireButton.addEventListener(

        "touchcancel",

        function() {


            firing = false;

        }

    );


    // RELOAD

    document

        .getElementById("reload")

        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                reload();

            },

            { passive: false }

        );


    // SPRINT

    const sprintButton =

        document.getElementById(

            "sprint"

        );


    sprintButton.addEventListener(

        "touchstart",

        function(e) {


            e.preventDefault();


            sprinting = true;

        },

        { passive: false }

    );


    sprintButton.addEventListener(

        "touchend",

        function() {


            sprinting = false;

        }

    );


    // WEAPON BUTTONS

    document

        .querySelectorAll(

            ".weaponButton"

        )

        .forEach(

            button => {


                button.addEventListener(

                    "touchstart",

                    function(e) {


                        e.preventDefault();


                        switchWeapon(

                            button.dataset.weapon

                        );

                    },

                    { passive: false }

                );

            }

        );


    // KEYBOARD WEAPONS

    document.addEventListener(

        "keydown",

        function(e) {


            if (

                e.key === "1"

            )

                switchWeapon(

                    "pistol"

                );


            if (

                e.key === "2"

            )

                switchWeapon(

                    "smg"

                );


            if (

                e.key === "3"

            )

                switchWeapon(

                    "rifle"

                );


            if (

                e.key === "4"

            )

                switchWeapon(

                    "sniper"

                );


            if (

                e.code === "Space"

            )

                shoot();

        }

    );


    // RESTART

    document

        .getElementById("restart")

        .addEventListener(

            "click",

            function() {


                location.reload();

            }

        );

}


// ============================================================
// SWITCH WEAPON
// ============================================================

function switchWeapon(

    weaponName

) {


    if (

        !weapons[weaponName]

    )

        return;


    if (reloading)

        return;


    currentWeapon =

        weaponName;


    buildWeapon();


    updateWeaponHUD();


    document

        .querySelectorAll(

            ".weaponButton"

        )

        .forEach(

            button => {


                button.classList.toggle(

                    "active",

                    button.dataset.weapon ===

                    currentWeapon

                );

            }

        );

}


// ============================================================
// MOVEMENT
// ============================================================

function movePlayer(

    delta

) {


    if (gameOver)

        return;


    let speed =

        sprinting

        ? 12

        : 6;


    let forward =

        new THREE.Vector3(

            0,

            0,

            -1

        );


    let right =

        new THREE.Vector3(

            1,

            0,

            0

        );


    forward.applyQuaternion(

        player.quaternion

    );


    right.applyQuaternion(

        player.quaternion

    );


    forward.y = 0;

    right.y = 0;


    forward.normalize();

    right.normalize();


    let movement =

        new THREE.Vector3();


    movement.add(

        forward.multiplyScalar(

            -joyY

        )

    );


    movement.add(

        right.multiplyScalar(

            joyX

        )

    );


    if (

        movement.length() > 0

    ) {


        movement.normalize();


        let move =

            movement.multiplyScalar(

                speed *

                delta

            );


        let testX =

            player.position.clone();


        testX.x +=

            move.x;


        if (

            !checkCollision(

                testX

            )

        ) {


            player.position.x =

                testX.x;

        }


        let testZ =

            player.position.clone();


        testZ.z +=

            move.z;


        if (

            !checkCollision(

                testZ

            )

        ) {


            player.position.z =

                testZ.z;

        }

    }

}


// ============================================================
// PLAYER COLLISION
// ============================================================

function checkCollision(

    position

) {


    const box =

        new THREE.Box3();


    box.setFromCenterAndSize(

        position,

        new THREE.Vector3(

            1,

            2,

            1

        )

    );


    for (

        let wall of walls

    ) {


        const wallBox =

            new THREE.Box3()

            .setFromObject(wall);


        if (

            box.intersectsBox(

                wallBox

            )

        ) {


            return true;

        }

    }


    return false;

}


// ============================================================
// SHOOT
// ============================================================

function shoot() {


    if (

        gameOver ||

        reloading

    )

        return;


    const weapon =

        weapons[currentWeapon];


    const now =

        performance.now();


    if (

        now -

        lastShot <

        weapon.fireRate

    )

        return;


    lastShot = now;


    if (

        weapon.ammo <= 0

    ) {


        reload();


        return;

    }


    weapon.ammo--;


    updateWeaponHUD();


    muzzleFlash.visible =

        true;


    setTimeout(

        function() {


            muzzleFlash.visible =

                false;


        },

        60

    );


    const raycaster =

        new THREE.Raycaster();


    raycaster.setFromCamera(

        new THREE.Vector2(

            0,

            0

        ),

        camera

    );


    const targets =

        enemies.filter(

            e => e.alive

        );


    const hits =

        raycaster.intersectObjects(

            targets,

            true

        );


    if (

        hits.length > 0

    ) {


        let object =

            hits[0].object;


        let enemy = null;


        while (

            object

        ) {


            if (

                object.health !==

                undefined

            ) {


                enemy = object;


                break;

            }


            object =

                object.parent;

        }


        if (!enemy)

            return;


        enemy.health -=

            weapon.damage;


        updateEnemyHealthBar(

            enemy

        );


        showHitMarker();


        if (

            enemy.health <= 0

        ) {


            killEnemy(

                enemy

            );

        }

    }

}


// ============================================================
// AUTOMATIC FIRE
// ============================================================

function updateFiring() {


    if (

        firing

    ) {


        shoot();

    }

}


// ============================================================
// ENEMY HEALTH
// ============================================================

function updateEnemyHealthBar(

    enemy

) {


    const percent =

        Math.max(

            0,

            enemy.health /

            100

        );


    enemy.healthBar.scale.x =

        percent;


    enemy.healthBar.position.x =

        -(1.9 *

        (1 - percent)) /

        2;

}


// ============================================================
// KILL ENEMY
// ============================================================

function killEnemy(

    enemy

) {


    enemy.alive =

        false;


    scene.remove(

        enemy

    );


    kills++;


    updateHUD();


    if (

        enemies.every(

            e => !e.alive

        )

    ) {


        winGame();

    }

}


// ============================================================
// RELOAD
// ============================================================

function reload() {


    const weapon =

        weapons[currentWeapon];


    if (

        reloading ||

        weapon.ammo >=

        weapon.magazine ||

        weapon.reserve <= 0

    )

        return;


    reloading =

        true;


    document

        .getElementById(

            "reload"

        )

        .textContent =

        "RELOADING";


    setTimeout(

        function() {


            let needed =

                weapon.magazine -

                weapon.ammo;


            let amount =

                Math.min(

                    needed,

                    weapon.reserve

                );


            weapon.ammo +=

                amount;


            weapon.reserve -=

                amount;


            reloading =

                false;


            document

                .getElementById(

                    "reload"

                )

                .textContent =

                "RELOAD";


            updateWeaponHUD();


        },

        weapon.reloadTime

    );

}


// ============================================================
// ENEMY AI
// ============================================================

function updateEnemies(

    delta

) {


    if (gameOver)

        return;


    for (

        let enemy of enemies

    ) {


        if (!enemy.alive)

            continue;


        const direction =

            new THREE.Vector3();


        direction.subVectors(

            player.position,

            enemy.position

        );


        direction.y = 0;


        const distance =

            direction.length();


        // DETECTION RANGE

        if (

            distance <=

            enemy.detectionRange

        ) {


            // FACE PLAYER

            const angle =

                Math.atan2(

                    direction.x,

                    direction.z

                );


            enemy.rotation.y =

                angle;


            // MOVE

            if (

                distance >

                enemy.shootRange

            ) {


                direction.normalize();


                const movement =

                    direction.multiplyScalar(

                        enemy.speed *

                        delta

                    );


                const test =

                    enemy.position.clone();


                test.add(

                    movement

                );


                if (

                    !checkEnemyCollision(

                        test

                    )

                ) {


                    enemy.position.copy(

                        test

                    );

                }

            }


            // ANIMATION

            enemy.walkTime +=

                delta * 8;


            enemy.leftArm.rotation.z =

                Math.sin(

                    enemy.walkTime

                ) *

                0.4;


            enemy.rightArm.rotation.z =

                -Math.sin(

                    enemy.walkTime

                ) *

                0.4;


            // SHOOT TIMER

            enemy.shootTimer -=

                delta;


            if (

                distance <=

                enemy.shootRange &&

                enemy.shootTimer <= 0

            ) {


                enemy.shootTimer =

                    1.2 +

                    Math.random() *

                    1.5;


                enemyShoot(

                    enemy

                );

            }

        }

    }

}


// ============================================================
// ENEMY COLLISION
// ============================================================

function checkEnemyCollision(

    position

) {


    const box =

        new THREE.Box3();


    box.setFromCenterAndSize(

        position,

        new THREE.Vector3(

            1.5,

            3,

            1.5

        )

    );


    for (

        let wall of walls

    ) {


        const wallBox =

            new THREE.Box3()

            .setFromObject(wall);


        if (

            box.intersectsBox(

                wallBox

            )

        ) {


            return true;

        }

    }


    return false;

}


// ============================================================
// ENEMY SHOOT
// ============================================================

function enemyShoot(

    enemy

) {


    if (gameOver)

        return;


    const direction =

        new THREE.Vector3();


    direction.subVectors(

        player.position,

        enemy.position

    );


    direction.normalize();


    const raycaster =

        new THREE.Raycaster(

            enemy.position,

            direction

        );


    const wallHits =

        raycaster.intersectObjects(

            walls,

            false

        );


    if (

        wallHits.length > 0

    ) {


        const wallDistance =

            wallHits[0].distance;


        const playerDistance =

            enemy.position.distanceTo(

                player.position

            );


        if (

            wallDistance <

            playerDistance

        ) {


            return;

        }

    }


    // SHOOTING ANIMATION

    enemy.leftArm.rotation.x =

        -0.5;


    enemy.rightArm.rotation.x =

        -0.5;


    setTimeout(

        function() {


            if (

                enemy.alive

            ) {


                enemy.leftArm.rotation.x =

                    0;


                enemy.rightArm.rotation.x =

                    0;

            }


        },

        200

    );


    createEnemyBullet(

        enemy.position.clone()

        .add(

            new THREE.Vector3(

                0,

                2.2,

                0

            )

        ),

        direction,

        enemy.weaponDamage

    );

}


// ============================================================
// ENEMY BULLET
// ============================================================

function createEnemyBullet(

    position,

    direction,

    damage

) {


    const bullet =

        new THREE.Mesh(

            new THREE.SphereGeometry(

                0.12,

                8,

                8

            ),

            new THREE.MeshBasicMaterial({

                color: 0xff0000

            })

        );


    bullet.position.copy(

        position

    );


    bullet.velocity =

        direction.clone()

        .multiplyScalar(

            35

        );


    bullet.damage =

        damage;


    scene.add(

        bullet

    );


    enemyBullets.push(

        bullet

    );

}


// ============================================================
// UPDATE ENEMY BULLETS
// ============================================================

function updateEnemyBullets(

    delta

) {


    for (

        let i =

        enemyBullets.length - 1;

        i >= 0;

        i--

    ) {


        const bullet =

            enemyBullets[i];


        bullet.position.add(

            bullet.velocity

            .clone()

            .multiplyScalar(

                delta

            )

        );


        // PLAYER HIT

        if (

            bullet.position.distanceTo(

                player.position

            ) < 1

        ) {


            takeDamage(

                bullet.damage

            );


            scene.remove(

                bullet

            );


            enemyBullets.splice(

                i,

                1

            );


            continue;

        }


        // WALL HIT

        let hitWall = false;


        for (

            let wall of walls

        ) {


            const wallBox =

                new THREE.Box3()

                .setFromObject(

                    wall

                );


            if (

                wallBox.containsPoint(

                    bullet.position

                )

            ) {


                hitWall = true;


                break;

            }

        }


        if (

            hitWall

        ) {


            scene.remove(

                bullet

            );


            enemyBullets.splice(

                i,

                1

            );


            continue;

        }


        // OUT OF MAP

        if (

            Math.abs(

                bullet.position.x

            ) > 100 ||

            Math.abs(

                bullet.position.z

            ) > 100

        ) {


            scene.remove(

                bullet

            );


            enemyBullets.splice(

                i,

                1

            );

        }

    }

}


// ============================================================
// DAMAGE PLAYER
// ============================================================

function takeDamage(

    damage

) {


    if (gameOver)

        return;


    health -=

        damage;


    health =

        Math.max(

            0,

            health

        );


    updateHUD();


    const flash =

        document.getElementById(

            "damageFlash"

        );


    flash.style.opacity =

        1;


    setTimeout(

        function() {


            flash.style.opacity =

                0;


        },

        150

    );


    if (

        health <= 0

    ) {


        loseGame();

    }

}


// ============================================================
// HIT MARKER
// ============================================================

function showHitMarker() {


    const marker =

        document.getElementById(

            "hitMarker"

        );


    marker.style.opacity =

        1;


    setTimeout(

        function() {


            marker.style.opacity =

                0;


        },

        100

    );

}


// ============================================================
// HUD
// ============================================================

function updateHUD() {


    document

        .getElementById(

            "health"

        )

        .style.width =

        health + "%";

        .getElementById(

            "kills"

        )

        .textContent =

    document

        .getElementById(

            "enemyCount"

        )

            e => e.alive

        ).length;

}


// ============================================================
// WEAPON HUD
// ============================================================

function updateWeaponHUD() {


    const weapon =

        weapons[currentWeapon];


    document

        .getElementById(

            "weaponName"

        )

        .textContent =

        weapon.name;


    document

        .getElementById(

        )

        .textContent =

// ============================================================
// MINIMAP
// ============================================================

function updateMinimap() {


    const canvas =

        document.getElementById(

            "minimap"

        );


    const ctx =

        canvas.getContext(

            "2d"

        );


    ctx.clearRect(

        0,

        0,

        150,

        150

    );


    ctx.fillStyle =

        "#333";


    ctx.fillRect(

        0,

        0,

        150,

        150

    );


    const scale =

        0.65;


    // ENEMIES

    for (

        let enemy of enemies

    ) {


        if (!enemy.alive)

            continue;


        let x =

            75 +

            enemy.position.x *

            scale;


        let y =

            75 +

            enemy.position.z *

            scale;


        if (

            x < 0 ||

            x > 150 ||

            y < 0 ||

            y > 150

        )

            continue;


        ctx.fillStyle =

            "red";


        ctx.beginPath();


        ctx.arc(

            x,

            y,

            4,

            0,

            Math.PI * 2

        );


        ctx.fill();

    }


    // PLAYER

    ctx.fillStyle =

        "lime";


    ctx.beginPath();


    ctx.arc(

        75 +

        player.position.x *

        scale,

        75 +

        player.position.z *

        scale,

        5,

        0,

        Math.PI * 2

    );


    ctx.fill();

}


// ============================================================
// WIN
// ============================================================

function winGame() {


    gameOver =

        true;


    document

        .getElementById(

            "messageText"

        )

        .textContent =

        "YOU WIN!";


    document

        .getElementById(

            "message"

        )

        .style.display =

        "block";

}


// ============================================================
// LOSE
// ============================================================

function loseGame() {


    gameOver =

        true;


    document

        .getElementById(

            "messageText"

        )

        .textContent =

        "GAME OVER";


    document

        .getElementById(

            "message"

        ).style.display =

        "block";

}


// ============================================================
// RESIZE
// ============================================================

function resize() {


    camera.aspect =

        window.innerWidth /

        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


// ============================================================
// GAME LOOP
// ============================================================

let lastTime =

    performance.now();


function animate() {


    requestAnimationFrame(

        animate

    );


    const now =

        performance.now();


    let delta =

        (

            now -

            lastTime

        ) / 1000;


    lastTime = now;


    delta =

        Math.min(

            delta,

            0.1

        );


    movePlayer(

        delta

    );


    updateFiring();


    updateEnemies(

        delta

    );


    updateEnemyBullets(

        delta

    );


    updateMinimap();


    renderer.render(

        scene,

        camera

    );

}


// ============================================================
// START GAME
// ============================================================

startGame();
