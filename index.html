html,

#hud {

    top: 15px;

/* =========================
CROSSHAIR
========================= */

#crosshair {

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-size: 30px;

    font-weight: bold;

    text-shadow:
        2px 2px 5px black;

    pointer-events: none;

    z-index: 10;

}


/* =========================
HIT MARKER
========================= */

#hitMarker {

    position: fixed;

    top: 50%;
    left: 50%;

    transform:

    color: white;

/* =========================

========================= */

#damageFlash {

/* =========================
JOYSTICK
========================= */

#joystick {

    position: fixed;

    left: 25px;

    width: 130px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.2);

    border:
        3px solid
        rgba(255,255,255,0.5);

    z-index: 30;

}

#stick {

    position: absolute;

    width: 50px;

    height: 50px;

    left: 40px;

    top: 40px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.7);

}


/* =========================
BUTTONS
========================= */

.controlButton {

    position: fixed;

    color: white;

    border:
        2px solid white;

    font-weight: bold;

    z-index: 30;

    touch-action: none;

}

#fire {

    right: 25px;

    bottom: 35px;

    width: 90px;

    height: 90px;

    border-radius: 50%;

    background: red;

}

#reload {

    right: 35px;

    bottom: 145px;

    width: 80px;

    height: 45px;

    border-radius: 8px;

    background: black;

}

#switchWeapon {

    right: 125px;

    bottom: 45px;

    width: 100px;

    height: 55px;

    border-radius: 10px;

    background: #222;

}

#sprint {

    left: 170px;

    bottom: 45px;

    width: 75px;

    height: 55px;

    border-radius: 12px;

    background:
        rgba(0,0,0,0.7);

}


/* =========================
MINIMAP
========================= */

#minimap {

    position: fixed;

    top: 15px;

    right: 15px;

    width: 150px;

    height: 150px;

    background:
        rgba(0,0,0,0.7);

    border:
        2px solid white;

    z-index: 25;

}


/* =========================
GAME OVER
========================= */

#message {

    position: fixed;

    top: 50%;

    left: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-size: 38px;

    font-weight: bold;

    text-align: center;

    text-shadow:
        3px 3px 7px black;

    z-index: 100;

    display: none;

}

#restart {

    margin-top: 20px;

    padding:
        12px 25px;

    background: black;

    color: white;

    border:
        2px solid white;

    border-radius: 8px;

    font-size: 18px;

}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>


// =====================================================
// GAME VARIABLES
// =====================================================

let scene;

let camera;

let renderer;

let player;

let gun;

let muzzleFlash;

let enemies = [];

let walls = [];

let projectiles = [];

let explosions = [];

let health = 100;

let kills = 0;

let gameOver = false;

let sprinting = false;

let reloading = false;

let firing = false;

let weaponIndex = 0;

let lastShot = 0;

let rotationY = 0;

let rotationX = 0;

let joyX = 0;

let joyY = 0;

let joystickTouch = null;

let aimTouch = null;

let lastAimX = 0;

let lastAimY = 0;


// =====================================================
// MAP
// =====================================================

const MAP_SIZE = 200;

const MAP_HALF = 100;


// =====================================================
// WEAPONS
// =====================================================

const weapons = [

    {

        name: "PISTOL",

        damage: 25,

        fireRate: 300,

        magazine: 12,

        ammo: 12,

        reserve: 60,

        type: "single",

        projectileSpeed: 80,

        color: 0x444444

    },


    {

        name: "SMG",

        damage: 12,

        fireRate: 80,

        magazine: 30,

        ammo: 30,

        reserve: 120,

        type: "automatic",

        projectileSpeed: 100,

        color: 0x333333

    },


    {

        name: "ASSAULT RIFLE",

        damage: 22,

        fireRate: 120,

        magazine: 30,

        ammo: 30,

        reserve: 120,

        type: "automatic",

        projectileSpeed: 110,

        color: 0x222222

    },


    {

        name: "SHOTGUN",

        damage: 15,

        fireRate: 700,

        magazine: 6,

        ammo: 6,

        reserve: 36,

        type: "shotgun",

        pellets: 8,

        projectileSpeed: 70,

        color: 0x654321

    },


    {

        name: "SNIPER",

        damage: 100,

        fireRate: 1200,

        magazine: 5,

        ammo: 5,

        reserve: 25,

        type: "single",

        projectileSpeed: 180,

        color: 0x111111

    },


    {

        name: "ROCKET LAUNCHER",

        damage: 100,

        fireRate: 1500,

        magazine: 1,

        ammo: 1,

        reserve: 8,

        type: "rocket",

        projectileSpeed: 35,

        color: 0x333333

    }

];


// =====================================================
// START
// =====================================================

function startGame() {


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x87CEEB
        );


    camera =
        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /
            window.innerHeight,

            0.1,

            1000

        );


    renderer =
        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    document.body.appendChild(

        renderer.domElement

    );


    const light =

        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            2

        );


    scene.add(light);


    const sun =

        new THREE.DirectionalLight(

            0xffffff,

            1

        );


    sun.position.set(

        50,

        100,

        50

    );


    scene.add(sun);


    player =
        new THREE.Object3D();


    player.position.set(

        0,

        1.7,

        80

    );


    scene.add(player);


    player.add(camera);


    createGround();

    createMap();

    createGun();

    setupControls();

    updateHUD();


    window.addEventListener(

        "resize",

        resize

    );


    animate();

}


// =====================================================
// GROUND
// =====================================================

function createGround() {


    const geometry =

        new THREE.PlaneGeometry(

            MAP_SIZE,

            MAP_SIZE

        );


    const material =

        new THREE.MeshLambertMaterial({

            color:
                0x228B22

        });


    const ground =

        new THREE.Mesh(

            geometry,

            material

        );


    ground.rotation.x =

        -Math.PI / 2;


    scene.add(ground);

}


// =====================================================
// WALL
// =====================================================

function createWall(

    x,

    z,

    width,

    depth,

    height = 5

) {


    const geometry =

        new THREE.BoxGeometry(

            width,

            height,

            depth

        );


    const material =

        new THREE.MeshLambertMaterial({

            color:
                0x777777

        });


    const wall =

        new THREE.Mesh(

            geometry,

            material

        );


    wall.position.set(

        x,

        height / 2,

        z

    );


    scene.add(wall);

    walls.push(wall);


    return wall;

}


// =====================================================
// MAP
// =====================================================

function createMap() {


    createWall(
        0,
        -MAP_HALF,
        MAP_SIZE,
        2,
        8
    );


    createWall(
        0,
        MAP_HALF,
        MAP_SIZE,
        2,
        8
    );


    createWall(
        -MAP_HALF,
        0,
        2,
        MAP_SIZE,
        8
    );


    createWall(
        MAP_HALF,
        0,
        2,
        MAP_SIZE,
        8
    );


    // Central cover

    createWall(
        -25,
        0,
        5,
        35,
        6
    );


    createWall(
        25,
        0,
        5,
        35,
        6
    );


    createWall(
        0,
        -25,
        35,
        5,
        6
    );


    createWall(
        0,
        25,
        35,
        5,
        6
    );


    // Outer cover

    const cover = [

        [-65,-65,20,4],

        [-65,-50,4,25],

        [65,-65,20,4],

        [65,-50,4,25],

        [-65,65,20,4],

        [-65,50,4,25],

        [65,65,20,4],

        [65,50,4,25],

        [-45,-20,10,4],

        [45,-20,10,4],

        [-45,20,10,4],

        [45,20,10,4],

        [-20,-60,4,12],

        [20,-60,4,12],

        [-20,60,4,12],

        [20,60,4,12]

    ];


    for (

        const c of cover

    ) {


        createWall(

            c[0],

            c[1],

            c[2],

            c[3],

            4

        );

    }

}


// =====================================================
// CREATE WEAPON MODEL
// =====================================================

function createGun() {


    gun =
        new THREE.Group();


    gun.position.set(

        0.35,

        -0.3,

        -0.8

    );


    camera.add(gun);


    updateWeaponModel();

}


// =====================================================
// WEAPON MODEL SWITCH
// =====================================================

function updateWeaponModel() {


    while (

        gun.children.length > 0

    ) {


        gun.remove(

            gun.children[0]

        );

    }


    const weapon =

        weapons[weaponIndex];


    const material =

        new THREE.MeshLambertMaterial({

            color:
                weapon.color

        });


    // PISTOL

    if (

        weapon.name ===
        "PISTOL"

    ) {


        const body =

            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.25,

                    0.25,

                    0.7

                ),

                material

            );


        gun.add(body);


        const barrel =

            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.045,

                    0.045,

                    0.4,

                    12

                ),

                material

            );


        barrel.rotation.x =

            Math.PI / 2;


        barrel.position.z =

            -0.55;


        gun.add(barrel);

    }


    // SMG

    else if (

        weapon.name ===
        "SMG"

    ) {


        const body =

            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.35,

                    0.3,

                    0.9

                ),

                material

            );


        gun.add(body);


        const barrel =

            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.05,

                    0.05,

                    0.8,

                    12

                ),

                material

            );


        barrel.rotation.x =

            Math.PI / 2;


        barrel.position.z =

            -0.8;


        gun.add(barrel);


        const magazine =

            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.15,

                    0.5,

                    0.2

                ),

                material

            );


        magazine.position.y =

            -0.35;


        gun.add(magazine);

    }


    // ASSAULT RIFLE

    else if (

        weapon.name ===
        "ASSAULT RIFLE"

    ) {


        const body =

            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.4,

                    0.35,

                    1.2

                ),

                material

            );


        gun.add(body);


        const barrel =

            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.055,

                    0.055,

                    1.1,

                    12

                ),

                material

            );


        barrel.rotation.x =

            Math.PI / 2;


        barrel.position.z =

            -1;


        gun.add(barrel);


        const stock =

            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.35,

                    0.3,

                    0.4

                ),

                material

            );


        stock.position.z =

            0.7;


        gun.add(stock);

    }


    // SHOTGUN

    else if (

        weapon.name ===
        "SHOTGUN"

    ) {


        const barrel1 =

            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.07,

                    0.07,

                    1.5,

                    12

                ),

                material

            );


        barrel1.rotation.x =

            Math.PI / 2;


        barrel1.position.z =

            -0.8;


        barrel1.position.x =

            -0.08;


        gun.add(barrel1);


        const barrel2 =

            barrel1.clone();


        barrel2.position.x =

            0.08;


        gun.add(barrel2);

    }


    // SNIPER

    else if (

        weapon.name ===
        "SNIPER"

    ) {


        const body =

            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.3,

                    0.3,

                    1.4

                ),

                material

            );


        gun.add(body);


        const barrel =

            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.045,

                    0.045,

                    1.8,

                    12

                ),

                material

            );


        barrel.rotation.x =

            Math.PI / 2;


        barrel.position.z =

            -1.5;


        gun.add(barrel);


        const scope =

            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.06,

                    0.06,

                    0.4,

                    12

                ),

                material

            );


        scope.rotation.x =

            Math.PI / 2;


        scope.position.y =

            0.25;


        gun.add(scope);

    }


    // ROCKET LAUNCHER

    else {


        const tube =

            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.18,

                    0.18,

                    1.6,

                    16

                ),

                material

            );


        tube.rotation.x =

            Math.PI / 2;


        gun.add(tube);


        const rocketTip =

            new THREE.Mesh(

                new THREE.ConeGeometry(

                    0.15,

                    0.35,

                    12

                ),

                new THREE.MeshBasicMaterial({

                    color:
                        0xff0000

                })

            );


        rocketTip.rotation.x =

            -Math.PI / 2;


        rocketTip.position.z =

            -0.95;


        gun.add(rocketTip);

    }


    // Muzzle flash

    muzzleFlash =

        new THREE.Mesh(

            new THREE.SphereGeometry(

                0.15,

                8,

                8

            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xffff00

            })

        );


    muzzleFlash.position.z =

        -1.2;


    muzzleFlash.visible =

        false;


    gun.add(

        muzzleFlash

    );

}


// =====================================================
// SWITCH WEAPON
// =====================================================

function switchWeapon() {


    if (

        reloading ||
        gameOver

    )
        return;


    weaponIndex++;


    if (

        weaponIndex >=
        weapons.length

    ) {


        weaponIndex = 0;

    }


    updateWeaponModel();

    updateHUD();

}


// =====================================================
// SHOOT
// =====================================================

function shoot() {


    if (

        gameOver ||
        reloading

    )
        return;


    const weapon =

        weapons[weaponIndex];


    const now =

        performance.now();


    if (

        now -
        lastShot <
        weapon.fireRate

    )
        return;


    if (

        weapon.ammo <= 0

    ) {


        reload();

        return;

    }


    lastShot = now;


    weapon.ammo--;


    updateHUD();


    showMuzzleFlash();


    if (

        weapon.type ===
        "shotgun"

    ) {


        for (

            let i = 0;

            i <
            weapon.pellets;

            i++

        ) {


            fireProjectile(

                weapon,

                true

            );

        }

    }

    else {


        fireProjectile(

            weapon,

            false

        );

    }

}


// =====================================================
// CREATE PROJECTILE
// =====================================================

function fireProjectile(

    weapon,

    shotgun

) {


    const direction =

        new THREE.Vector3(

            0,

            0,

            -1

        );


    camera.getWorldDirection(

        direction

    );


    if (

        shotgun

    ) {


        direction.x +=

            (
                Math.random() -
                0.5

            ) *
            0.08;


        direction.y +=

            (
                Math.random() -
                0.5

            ) *
            0.08;


        direction.z +=

            (
                Math.random() -
                0.5

            ) *
            0.08;


        direction.normalize();

    }


    const color =

        weapon.type ===
        "rocket"

        ? 0xff5500

        : 0xffff00;


    const size =

        weapon.type ===
        "rocket"

        ? 0.25

        : 0.06;


    const projectile =

        new THREE.Mesh(

            new THREE.SphereGeometry(

                size,

                8,

                8

            ),

            new THREE.MeshBasicMaterial({

                color:
                    color

            })

        );


    const startPosition =

        new THREE.Vector3();


    camera.getWorldPosition(

        startPosition

    );


    projectile.position.copy(

        startPosition

    );


    projectile.userData = {

        velocity:

            direction.multiplyScalar(

                weapon.projectileSpeed

            ),

        damage:

            weapon.damage,

        rocket:

            weapon.type ===
            "rocket",

        life:

            4

    };


    scene.add(

        projectile

    );


    projectiles.push(

        projectile

    );

}


// =====================================================
// UPDATE PROJECTILES
// =====================================================

function updateProjectiles(

    delta

) {


    for (

        let i =
        projectiles.length - 1;

        i >= 0;

        i--

    ) {


        const projectile =

            projectiles[i];


        projectile.position.add(

            projectile.userData.velocity
            .clone()
            .multiplyScalar(delta)

        );


        projectile.userData.life -=

            delta;


        // Wall collision

        let hitWall = false;


        for (

            const wall of walls

        ) {


            const box =

                new THREE.Box3()
                .setFromObject(wall);


            if (

                box.containsPoint(

                    projectile.position

                )

            ) {


                hitWall = true;


                if (

                    projectile.userData.rocket

                ) {


                    createExplosion(

                        projectile.position,

                        projectile.userData.damage

                    );

                }


                break;

            }

        }


        if (

            hitWall

        ) {


            scene.remove(

                projectile

            );


            projectiles.splice(

                i,

                1

            );


            continue;

        }


        // Future enemy collision

        for (

            const enemy of enemies

        ) {


            if (

                !enemy.alive

            )
                continue;


            const distance =

                projectile.position.distanceTo(

                    enemy.position

                );


            if (

                distance < 1.5

            ) {


                if (

                    projectile.userData.rocket

                ) {


                    createExplosion(

                        projectile.position,

                        projectile.userData.damage

                    );

                }

                else {


                    damageEnemy(

                        enemy,

                        projectile.userData.damage

                    );

                }


                scene.remove(

                    projectile

                );


                projectiles.splice(

                    i,

                    1

                );


                break;

            }

        }


        if (

            projectile.userData.life <= 0

        ) {


            scene.remove(

                projectile

            );


            projectiles.splice(

                i,

                1

            );

        }

    }

}


// =====================================================
// ENEMY DAMAGE
// =====================================================

function damageEnemy(

    enemy,

    damage

) {


    if (

        !enemy.health

    ) {


        enemy.health = 100;

    }


    enemy.health -=

        damage;


    showHitMarker();


    if (

        enemy.health <= 0

    ) {


        enemy.alive = false;


        scene.remove(

            enemy

        );


        kills++;


        updateHUD();

    }

}


// =====================================================
// ROCKET EXPLOSION
// =====================================================

function createExplosion(

    position,

    damage

) {


    const explosion =

        new THREE.Mesh(

            new THREE.SphereGeometry(

                0.5,

                12,

                12

            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xff6600,

                transparent:
                    true,

                opacity:
                    0.8

            })

        );


    explosion.position.copy(

        position

    );


    scene.add(

        explosion

    );


    explosions.push({

        mesh:
            explosion,

        life:
            0.5,

        maxSize:
            5,

        damage:
            damage

    });


    for (

        const enemy of enemies

    ) {


        if (

            !enemy.alive

        )
            continue;


        const distance =

            enemy.position.distanceTo(

                position

            );


        if (

            distance < 5

        ) {


            const explosionDamage =

                damage *
                (
                    1 -
                    distance /
                    5
                );


            damageEnemy(

                enemy,

                explosionDamage

            );

        }

    }

}


// =====================================================
// UPDATE EXPLOSIONS
// =====================================================

function updateExplosions(

    delta

) {


    for (

        let i =
        explosions.length - 1;

        i >= 0;

        i--

    ) {


        const explosion =

            explosions[i];


        explosion.life -=

            delta;


        const progress =

            1 -
            (
                explosion.life /
                0.5
            );


        const size =

            0.5 +
            progress *
            explosion.maxSize;


        explosion.mesh.scale.set(

            size,

            size,

            size

        );


        explosion.mesh.material.opacity =

            explosion.life *
            1.5;


        if (

            explosion.life <= 0

        ) {


            scene.remove(

                explosion.mesh

            );


            explosions.splice(

                i,

                1

            );

        }

    }

}

// =====================================================
// RELOAD
// =====================================================

function reload() {


    const weapon =

        weapons[weaponIndex];


    if (

        reloading ||
        weapon.ammo >=
        weapon.magazine ||
        weapon.reserve <= 0

    )
        return;


    reloading = true;


    document.getElementById(

        "reload"

    ).textContent =

        "RELOADING";


    setTimeout(

        function() {


            const needed =

                weapon.magazine -
                weapon.ammo;


            const amount =

                Math.min(

                    needed,

                    weapon.reserve

                );


            weapon.ammo +=

                amount;


            weapon.reserve -=

                amount;


            reloading = false;


            document.getElementById(

                "reload"

            ).textContent =

                "RELOAD";


            updateHUD();


        },

        weapon.name ===
        "ROCKET LAUNCHER"

        ? 1500

        : 1000

    );

}


// =====================================================
// CONTROLS
// =====================================================

function setupControls() {


    const joystick =

        document.getElementById(

            "joystick"

        );


    const stick =

        document.getElementById(

            "stick"

        );


    joystick.addEventListener(

        "touchstart",

        function(e) {


            e.preventDefault();


            joystickTouch =

                e.changedTouches[0]
                .identifier;


        },

        {

            passive:
                false

        }

    );


    joystick.addEventListener(

        "touchmove",

        function(e) {


            e.preventDefault();


            const touch =

                [...e.touches].find(

                    t =>

                    t.identifier ===
                    joystickTouch

                );


            if (!touch)
                return;


            const rect =

                joystick.getBoundingClientRect();


            let x =

                touch.clientX -
                (
                    rect.left +
                    rect.width /
                    2
                );


            let y =

                touch.clientY -
                (
                    rect.top +
                    rect.height /
                    2
                );


            const max = 40;


            const distance =

                Math.sqrt(

                    x*x +
                    y*y

                );


            if (

                distance > max

            ) {


                x =

                    x /
                    distance *
                    max;


                y =

                    y /
                    distance *
                    max;

            }


            joyX =

                x /
                max;


            joyY =

                y /
                max;


            stick.style.transform =

                `translate(${x}px,${y}px)`;


        },

        {

            passive:
                false

        }

    );


    joystick.addEventListener(

        "touchend",

        function() {


            joystickTouch =

                null;


            joyX = 0;

            joyY = 0;


            stick.style.transform =

                "translate(0,0)";


        }

    );


    // Aim

    renderer.domElement.addEventListener(

        "touchstart",

        function(e) {


            for (

                const touch of
                e.changedTouches

            ) {


                if (

                    touch.clientX >
                    window.innerWidth /
                    2

                ) {


                    aimTouch =

                        touch.identifier;


                    lastAimX =

                        touch.clientX;


                    lastAimY =

                        touch.clientY;

                }

            }

        }

    );


    renderer.domElement.addEventListener(

        "touchmove",

        function(e) {


            for (

                const touch of
                e.changedTouches

            ) {


                if (

                    touch.identifier ===
                    aimTouch

                ) {


                    rotationY -=

                        (
                            touch.clientX -
                            lastAimX
                        ) *
                        0.004;


                    rotationX -=

                        (
                            touch.clientY -
                            lastAimY
                        ) *
                        0.004;


                    rotationX =

                        Math.max(

                            -1.3,

                            Math.min(

                                1.3,

                                rotationX

                            )

                        );


                    player.rotation.y =

                        rotationY;


                    camera.rotation.x =

                        rotationX;


                    lastAimX =

                        touch.clientX;


                    lastAimY =

                        touch.clientY;

                }

            }

        }

    );


    renderer.domElement.addEventListener(

        "touchend",

        function(e) {


            for (

                const touch of
                e.changedTouches

            ) {


                if (

                    touch.identifier ===
                    aimTouch

                ) {


                    aimTouch =

                        null;

                }

            }

        }

    );


    // Fire button

    document
        .getElementById("fire")
        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                firing = true;


                shoot();


            },

            {

                passive:
                    false

            }

        );


    document
        .getElementById("fire")
        .addEventListener(

            "touchend",

            function() {


                firing = false;


            }

        );


    // Reload

    document
        .getElementById("reload")
        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                reload();


            },

            {

                passive:
                    false

            }

        );


    // Switch

    document
        .getElementById("switchWeapon")
        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                switchWeapon();


            },

            {

                passive:
                    false

            }

        );


    // Sprint

    const sprintButton =

        document.getElementById(

            "sprint"

        );


    sprintButton.addEventListener(

        "touchstart",

        function(e) {


            e.preventDefault();


            sprinting = true;


        },

        {

            passive:
                false

        }

    );


    sprintButton.addEventListener(

        "touchend",

        function() {


            sprinting = false;


        }

    );


    // Restart

    document
        .getElementById("restart")
        .addEventListener(

            "click",

            function() {


                location.reload();


            }

        );

}


// =====================================================
// MOVEMENT COLLISION
// =====================================================

function checkCollision(

    position

) {


    const playerBox =

        new THREE.Box3();


    playerBox.setFromCenterAndSize(

        position,

        new THREE.Vector3(

            0.8,

            2,

            0.8

        )

    );


    for (

        const wall of walls

    ) {


        const wallBox =

            new THREE.Box3()
            .setFromObject(wall);


        if (

            playerBox.intersectsBox(

                wallBox

            )

        ) {


            return true;

        }

    }


    return false;

}


// =====================================================
// MOVEMENT
// =====================================================

function movePlayer(

    delta

) {


    if (gameOver)
        return;


    const speed =

        sprinting

        ? 12

        : 6;


    const forward =

        new THREE.Vector3(

            0,

            0,

            -1

        );


    const right =

        new THREE.Vector3(

            1,

            0,

            0

        );


    forward.applyQuaternion(

        player.quaternion

    );


    right.applyQuaternion(

        player.quaternion

    );


    forward.y = 0;

    right.y = 0;


    forward.normalize();

    right.normalize();


    const movement =

        new THREE.Vector3();


    movement.add(

        forward.multiplyScalar(

            -joyY

        )

    );


    movement.add(

        right.multiplyScalar(

            joyX

        )

    );


    if (

        movement.length() > 0

    ) {


        movement.normalize();


        const move =

            movement.multiplyScalar(

                speed *
                delta

            );


        const testX =

            player.position.clone();


        testX.x +=

            move.x;


        if (

            !checkCollision(

                testX

            )

        ) {


            player.position.x =

                testX.x;

        }


        const testZ =

            player.position.clone();


        testZ.z +=

            move.z;


        if (

            !checkCollision(

                testZ

            )

        ) {


            player.position.z =

                testZ.z;

        }

    }

}

// =====================================================
// MINIMAP
// =====================================================

function updateMinimap() {


    const canvas =

        document.getElementById(

            "minimap"

        );


    const ctx =

        canvas.getContext(

            "2d"

        );


    ctx.clearRect(

        0,

        0,

        150,

        150

    );


    ctx.fillStyle =

        "#333";


    ctx.fillRect(

        0,

        0,

        150,

        150

    );


    const scale =

        150 /
        MAP_SIZE;


    ctx.fillStyle =

        "#777";


    for (

        const wall of walls

    ) {


        const box =

            new THREE.Box3()
            .setFromObject(wall);


        ctx.fillRect(

            (
                box.min.x +
                MAP_HALF
            ) *
            scale,

            (
                box.min.z +
                MAP_HALF
            ) *
            scale,

            (
                box.max.x -
                box.min.x
            ) *
            scale,

            (
                box.max.z -
                box.min.z
            ) *
            scale

        );

    }


    ctx.fillStyle =

        "lime";


    ctx.beginPath();


    ctx.arc(

        (
            player.position.x +
            MAP_HALF
        ) *
        scale,

        (
            player.position.z +
            MAP_HALF
        ) *
        scale,

        4,

        0,

        Math.PI * 2

    );


    ctx.fill();

}


// =====================================================
// RESIZE
// =====================================================

function resize() {


    camera.aspect =

        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


// =====================================================
// GAME LOOP
// =====================================================

let lastTime =

    performance.now();


function animate() {


    requestAnimationFrame(

        animate

    );


    const now =

        performance.now();


    let delta =

        (
            now -
            lastTime

        ) /
        1000;


    lastTime = now;


    delta =

        Math.min(

            delta,

            0.1

        );


    movePlayer(

        delta

    );


    // Automatic weapons

    if (

        firing

    ) {


        const weapon =

            weapons[weaponIndex];


        if (

            weapon.type ===
            "automatic"

        ) {


            shoot();

        }

    }


    updateProjectiles(

        delta

    );


    updateExplosions(

        delta

    );


    updateMinimap();


    renderer.render(

        scene,

        camera

    );

}


// =====================================================
// START
// =====================================================

startGame();
