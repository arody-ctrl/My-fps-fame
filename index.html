* {

html,

/* =========================
HUD
========================= */

#hud {

    position: fixed;

    top: 15px;
    left: 15px;

    color: white;

    font-weight: bold;

    text-shadow:
        2px 2px 4px black;

}

#healthBar {

    width: 200px;

    height: 22px;

}

.stat {

    margin-top: 5px;

}

#weaponName {

    color: yellow;

    font-size: 20px;

}


/* =========================
CROSSHAIR
========================= */

#crosshair {

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-size: 30px;

    font-weight: bold;

    pointer-events: none;

}

DAMAGE FLASH
========================= */

    position: fixed;

        rgba(255,0,0,0.3);

========================= */

BUTTONS
========================= */

.controlButton {

/* =========================
MINIMAP
========================= */

    top: 15px;

    width: 150px;

        rgba(0,0,0,0.7);

        2px solid white;

}

GAME OVER
========================= */

// =====================================================
// START GAME
// =====================================================

function startGame() {


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x87CEEB
        );


    camera =
        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /
            window.innerHeight,

            0.1,

            1000

        );


    renderer =
        new THREE.WebGLRenderer({

            antialias:
                true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    document.body.appendChild(

        renderer.domElement

    );


    // Lighting

    const light =

        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            2

        );


    scene.add(light);


    const sun =

        new THREE.DirectionalLight(

            0xffffff,

            1

        );


    sun.position.set(

        50,

        100,

        50

    );


    scene.add(sun);


    // Player

    player =
        new THREE.Object3D();


    player.position.set(

        0,

        1.7,

        80

    );


    scene.add(player);


    player.add(camera);


    // Create world

    createGround();

    createMap();

    createGun();


    // Controls

    setupControls();


    // HUD

    updateHUD();


    window.addEventListener(

        "resize",

        resize

    );


    animate();

}


// =====================================================
// GROUND
// =====================================================

function createGround() {


    const geometry =

        new THREE.PlaneGeometry(

            MAP_SIZE,

            MAP_SIZE

        );


    const material =

        new THREE.MeshLambertMaterial({

            color:
                0x228B22

        });


    const ground =

        new THREE.Mesh(

            geometry,

            material

        );


    ground.rotation.x =

        -Math.PI / 2;


    scene.add(ground);

}


// =====================================================
// WALL
// =====================================================

function createWall(

    x,

    z,

    width,

    depth,

    height = 5

) {


    const geometry =

        new THREE.BoxGeometry(

            width,

            height,

            depth

        );


    const material =

        new THREE.MeshLambertMaterial({

            color:
                0x777777

        });


    const wall =

        new THREE.Mesh(

            geometry,

            material

        );


    wall.position.set(

        x,

        height / 2,

        z

    );


    scene.add(wall);


    walls.push(wall);


    return wall;

}


// =====================================================

// =====================================================
// GUN FOUNDATION
// =====================================================

function createGun() {


    gun =
        new THREE.Group();


    gun.position.set(

        0.35,

        -0.3,

        -0.8

    );


    camera.add(gun);


    const bodyGeometry =

        new THREE.BoxGeometry(

            0.25,

            0.25,

            0.8

        );


    const material =

        new THREE.MeshLambertMaterial({

            color:
                0x222222

        });


    const body =

        new THREE.Mesh(

            bodyGeometry,

            material

        );


    gun.add(body);


    const barrelGeometry =

        new THREE.CylinderGeometry(

            0.05,

            0.05,

            0.6,

            12

        );


    const barrel =

        new THREE.Mesh(

            barrelGeometry,

            material

        );


    barrel.rotation.x =

        Math.PI / 2;


    barrel.position.z =

        -0.6;


    gun.add(barrel);


    const flashGeometry =

        new THREE.SphereGeometry(

            0.15,

            8,

            8

        );


    muzzleFlash =

        new THREE.Mesh(

            flashGeometry,

            new THREE.MeshBasicMaterial({

                color:
                    0xffff00

            })

        );


    muzzleFlash.position.z =

        -0.9;


    muzzleFlash.visible =

        false;


    gun.add(

        muzzleFlash

    );

}


// =====================================================
// CONTROLS
// =====================================================

function setupControls() {


    const joystick =

        document.getElementById(

            "joystick"

        );


    const stick =

        document.getElementById(

            "stick"

        );


    // Joystick start

    joystick.addEventListener(

        "touchstart",

        function(e) {


            e.preventDefault();


            joystickTouch =

                e.changedTouches[0]
                .identifier;


        },

        {

            passive:
                false

        }

    );


    // Joystick movement

    joystick.addEventListener(

        "touchmove",

        function(e) {


            e.preventDefault();


            const touch =

                [...e.touches].find(

                    t =>

                    t.identifier ===
                    joystickTouch

                );


            if (!touch)
                return;


            const rect =

                joystick.getBoundingClientRect();


            let x =

                touch.clientX -
                (
                    rect.left +
                    rect.width / 2
                );


            let y =

                touch.clientY -
                (
                    rect.top +
                    rect.height / 2
                );


            const max = 40;


            const distance =

                Math.sqrt(

                    x*x +
                    y*y

                );


            if (

                distance > max

            ) {


                x =

                    x /
                    distance *
                    max;


                y =

                    y /
                    distance *
                    max;

            }


            joyX =

                x / max;


            joyY =

                y / max;


            stick.style.transform =

                `translate(${x}px,${y}px)`;


        },

        {

            passive:
                false

        }

    );


    joystick.addEventListener(

        "touchend",

        function() {


            joystickTouch =
                null;


            joyX = 0;

            joyY = 0;


            stick.style.transform =

                "translate(0,0)";


        }

    );


    // Touch aiming

    renderer.domElement.addEventListener(

        "touchstart",

        function(e) {


            for (

                const touch of
                e.changedTouches

            ) {


                if (

                    touch.clientX >
                    window.innerWidth / 2

                ) {


                    aimTouch =

                        touch.identifier;


                    lastAimX =

                        touch.clientX;


                    lastAimY =

                        touch.clientY;

                }

            }

        }

    );


    renderer.domElement.addEventListener(

        "touchmove",

        function(e) {


            for (

                const touch of
                e.changedTouches

            ) {


                if (

                    touch.identifier ===
                    aimTouch

                ) {


                    const dx =

                        touch.clientX -
                        lastAimX;


                    const dy =

                        touch.clientY -
                        lastAimY;


                    rotationY -=

                        dx *
                        0.004;


                    rotationX -=

                        dy *
                        0.004;


                    rotationX =

                        Math.max(

                            -1.3,

                            Math.min(

                                1.3,

                                rotationX

                            )

                        );


                    player.rotation.y =

                        rotationY;


                    camera.rotation.x =

                        rotationX;


                    lastAimX =

                        touch.clientX;


                    lastAimY =

                        touch.clientY;

                }

            }

        }

    );


    renderer.domElement.addEventListener(

        "touchend",

        function(e) {


            for (

                const touch of
                e.changedTouches

            ) {


                if (

                    touch.identifier ===
                    aimTouch

                ) {


                    aimTouch =
                        null;

                }

            }

        }

    );


    // Fire

    document
        .getElementById("fire")
        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                firing = true;


            },

            {

                passive:
                    false

            }

        );


    document
        .getElementById("fire")
        .addEventListener(

            "touchend",

            function() {


                firing = false;


            }

        );


    // Reload

    document
        .getElementById("reload")
        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                reload();


            },

            {

                passive:
                    false

            }

        );


    // Switch weapon

    document
        .getElementById("switchWeapon")
        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                switchWeapon();


            },

            {

                passive:
                    false

            }

        );


    // Sprint

    const sprintButton =

        document.getElementById(

            "sprint"

        );


    sprintButton.addEventListener(

        "touchstart",

        function(e) {


            e.preventDefault();


            sprinting = true;


        },

        {

            passive:
                false

        }

    );


    sprintButton.addEventListener(

        "touchend",

        function() {


            sprinting = false;


        }

    );


    // Restart

    document
        .getElementById("restart")
        .addEventListener(

            "click",

            function() {


                location.reload();


            }

        );

}


// =====================================================
// MOVEMENT COLLISION
// =====================================================

function checkCollision(

    position

) {


    const playerBox =

        new THREE.Box3();


    playerBox.setFromCenterAndSize(

        position,

        new THREE.Vector3(

            0.8,

            2,

            0.8

        )

    );


    for (

        const wall of walls

    ) {


        const wallBox =

            new THREE.Box3()
            .setFromObject(wall);


        if (

            playerBox.intersectsBox(

                wallBox

            )

        ) {


            return true;


        }

    }


    return false;


}


// =====================================================
// PLAYER MOVEMENT
// =====================================================

function movePlayer(

    delta

) {


    if (gameOver)
        return;


    const speed =

        sprinting
        ? 12
        : 6;


    const forward =

        new THREE.Vector3(

            0,

            0,

            -1

        );


    const right =

        new THREE.Vector3(

            1,

            0,

            0

        );


    forward.applyQuaternion(

        player.quaternion

    );


    right.applyQuaternion(

        player.quaternion

    );


    forward.y = 0;

    right.y = 0;


    forward.normalize();

    right.normalize();


    const movement =

        new THREE.Vector3();


    movement.add(

        forward.multiplyScalar(

            -joyY

        )

    );


    movement.add(

        right.multiplyScalar(

            joyX

        )

    );


    if (

        movement.length() > 0

    ) {


        movement.normalize();


        const move =

            movement.multiplyScalar(

                speed *
                delta

            );


        // X movement

        const testX =

            player.position.clone();


        testX.x +=

            move.x;


        if (

            !checkCollision(

                testX

            )

        ) {


            player.position.x =

                testX.x;


        }


        // Z movement

        const testZ =

            player.position.clone();


        testZ.z +=

            move.z;


        if (

            !checkCollision(

                testZ

            )

        ) {


            player.position.z =

                testZ.z;


        }

    }

}


// =====================================================
// WEAPON SWITCH
// =====================================================

function switchWeapon() {


    if (

        reloading ||
        gameOver

    )
        return;


    weaponIndex++;


    if (

        weaponIndex >=
        weapons.length

    ) {


        weaponIndex = 0;


    }


    updateHUD();


}


// =====================================================
// RELOAD FOUNDATION
// =====================================================

function reload() {


    const weapon =

        weapons[weaponIndex];


    if (

        reloading ||
        weapon.ammo >=
        weapon.magazine ||
        weapon.reserve <= 0

    )
        return;


    reloading = true;


    document.getElementById(

        "reload"

    ).textContent =

        "RELOADING";


    setTimeout(

        function() {


            const needed =

                weapon.magazine -
                weapon.ammo;


            const amount =

                Math.min(

                    needed,

                    weapon.reserve

                );


            weapon.ammo +=

                amount;


            weapon.reserve -=

                amount;


            reloading = false;


            document.getElementById(

                "reload"

            ).textContent =

                "RELOAD";


            updateHUD();


        },

        1000

    );

}


// =====================================================
// HUD
// =====================================================

function updateHUD() {


    const weapon =

        weapons[weaponIndex];


    document.getElementById(

        "weaponName"

    ).textContent =

        weapon.name;


    document.getElementById(

        "ammo"

    ).textContent =

        weapon.ammo;


    document.getElementById(

        "reserve"

    ).textContent =

        weapon.reserve;


    document.getElementById(

        "damage"

    ).textContent =

        weapon.damage;


    document.getElementById(

        "kills"

    ).textContent =

        kills;


    document.getElementById(

        "enemyCount"

    ).textContent =

        enemies.length;


    document.getElementById(

        "health"

    ).style.width =

        health +
        "%";

}


// =====================================================
// MINIMAP
// =====================================================

function updateMinimap() {


    const canvas =

        document.getElementById(

            "minimap"

        );


    const ctx =

        canvas.getContext(

            "2d"

        );


    ctx.clearRect(

        0,

        0,

        150,

        150

    );


    ctx.fillStyle =

        "#333";


    ctx.fillRect(

        0,

        0,

        150,

        150

    );


    // Convert 200x200 world
    // into 150x150 minimap

    const scale =

        150 /
        MAP_SIZE;


    // Draw walls

    ctx.fillStyle =

        "#777";


    for (

        const wall of walls

    ) {


        const box =

            new THREE.Box3()
            .setFromObject(wall);


        const width =

            box.max.x -
            box.min.x;


        const depth =

            box.max.z -
            box.min.z;


        const x =

            (
                box.min.x +
                MAP_HALF
            ) *
            scale;


        const y =

            (
                box.min.z +
                MAP_HALF
            ) *
            scale;


        ctx.fillRect(

            x,

            y,

            width *
            scale,

            depth *
            scale

        );

    }


    // Player

    ctx.fillStyle =

        "lime";


    const playerX =

        (
            player.position.x +
            MAP_HALF
        ) *
        scale;


    const playerY =

        (
            player.position.z +
            MAP_HALF
        ) *
        scale;


    ctx.beginPath();


    ctx.arc(

        playerX,

        playerY,

        4,

        0,

        Math.PI * 2

    );


    ctx.fill();

}


// =====================================================
// RESIZE
// =====================================================

function resize() {


    camera.aspect =

        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


// =====================================================
// GAME LOOP
// =====================================================

let lastTime =

    performance.now();


function animate() {


    requestAnimationFrame(

        animate

    );


    const now =

        performance.now();


    let delta =

        (
            now -
            lastTime

        ) / 1000;


    lastTime =

        now;


    delta =

        Math.min(

            delta,

            0.1

        );


    movePlayer(

        delta

    );


    // Automatic weapon
    // framework

    if (

        firing &&

        weapons[weaponIndex]
        .type ===
        "automatic"

    ) {


        // Shooting will be
        // added in Part 2

    }


    updateMinimap();


    renderer.render(

        scene,

        camera

    );

}


// =====================================================
// START
// =====================================================

startGame();


</script>
