<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mobile FPS V4</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #87CEEB;
    touch-action: none;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 2px 2px 4px black;
    z-index: 20;
}

#healthBar {
    width: 180px;
    height: 20px;
    margin-top: 4px;
    border: 2px solid white;
    background: #333;
}

#health {
    width: 100%;
    height: 100%;
    background: lime;
    transition: width .2s;
}

.stat {
    margin-top: 5px;
}

#weaponName {
    color: yellow;
    font-size: 20px;
}

#crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 30px;
    font-weight: bold;
    text-shadow: 2px 2px 5px black;
    pointer-events: none;
    z-index: 10;
}

#hitMarker {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 35px;
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    z-index: 15;
}

#damageFlash {
    position: fixed;
    inset: 0;
    background: rgba(255,0,0,.3);
    opacity: 0;
    pointer-events: none;
    z-index: 14;
}

#joystick {
    position: fixed;
    left: 25px;
    bottom: 30px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,.2);
    border: 3px solid rgba(255,255,255,.5);
    z-index: 30;
}

#stick {
    position: absolute;
    width: 50px;
    height: 50px;
    left: 40px;
    top: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,.7);
}

.controlButton {
    position: fixed;
    color: white;
    border: 2px solid white;
    font-weight: bold;
    z-index: 30;
}

#fire {
    right: 25px;
    bottom: 35px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: red;
}

#reload {
    right: 35px;
    bottom: 145px;
    width: 80px;
    height: 45px;
    border-radius: 8px;
    background: black;
}

#switchWeapon {
    right: 125px;
    bottom: 45px;
    width: 100px;
    height: 55px;
    border-radius: 10px;
    background: #222;
}

#sprint {
    left: 170px;
    bottom: 45px;
    width: 75px;
    height: 55px;
    border-radius: 12px;
    background: rgba(0,0,0,.7);
}

#minimap {
    position: fixed;
    top: 15px;
    right: 15px;
    width: 150px;
    height: 150px;
    background: rgba(0,0,0,.65);
    border: 2px solid white;
    z-index: 25;
}

#message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    color: white;
    font-size: 38px;
    font-weight: bold;
    text-align: center;
    text-shadow: 3px 3px 7px black;
    z-index: 100;
    display: none;
}

#restart {
    margin-top: 20px;
    padding: 12px 25px;
    background: black;
    color: white;
    border: 2px solid white;
    border-radius: 8px;
    font-size: 18px;
}
</style>
</head>

<body>

<div id="hud">

    HEALTH

    <div id="healthBar">
        <div id="health"></div>
    </div>

    <div class="stat">
        WEAPON:
        <span id="weaponName">PISTOL</span>
    </div>

    <div class="stat">
        AMMO:
        <span id="ammo">12</span>
        /
        <span id="reserve">60</span>
    </div>

    <div class="stat">
        DAMAGE:
        <span id="damage">25</span>
    </div>

    <div class="stat">
        KILLS:
        <span id="kills">0</span>
    </div>

    <div class="stat">
        ENEMIES:
        <span id="enemyCount">7</span>
    </div>

</div>

<div id="crosshair">+</div>
<div id="hitMarker">X</div>
<div id="damageFlash"></div>

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="sprint" class="controlButton">SPRINT</button>
<button id="switchWeapon" class="controlButton">SWITCH</button>
<button id="fire" class="controlButton">FIRE</button>
<button id="reload" class="controlButton">RELOAD</button>

<canvas id="minimap" width="150" height="150"></canvas>

<div id="message">

    <div id="messageText">
        GAME OVER
    </div>

    <button id="restart">
        RESTART
    </button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// =====================================================
// GAME VARIABLES
// =====================================================

let scene;
let camera;
let renderer;
let player;

let gun;
let muzzleFlash;

let enemies = [];
let walls = [];

let health = 100;
let kills = 0;

let gameOver = false;
let sprinting = false;
let reloading = false;

let lastShot = 0;
let weaponIndex = 0;

let joyX = 0;
let joyY = 0;

let joystickTouch = null;
let aimTouch = null;

let lastAimX = 0;
let lastAimY = 0;

let rotationY = 0;
let rotationX = 0;

let firing = false;


// =====================================================
// WEAPONS
// =====================================================

const weapons = [

    {
        name: "PISTOL",
        damage: 25,
        fireRate: 300,
        magazine: 12,
        ammo: 12,
        reserve: 60,
        color: 0x222222,
        type: "single"
    },

    {
        name: "SMG",
        damage: 12,
        fireRate: 80,
        magazine: 30,
        ammo: 30,
        reserve: 120,
        color: 0x333333,
        type: "automatic"
    },

    {
        name: "ASSAULT RIFLE",
        damage: 22,
        fireRate: 120,
        magazine: 30,
        ammo: 30,
        reserve: 120,
        color: 0x555555,
        type: "automatic"
    },

    {
        name: "SHOTGUN",
        damage: 15,
        fireRate: 700,
        magazine: 6,
        ammo: 6,
        reserve: 36,
        color: 0x663300,
        type: "shotgun"
    },

    {
        name: "SNIPER",
        damage: 100,
        fireRate: 1200,
        magazine: 5,
        ammo: 5,
        reserve: 25,
        color: 0x111111,
        type: "single"
    },

    {
        name: "ROCKET LAUNCHER",
        damage: 100,
        fireRate: 1500,
        magazine: 1,
        ammo: 1,
        reserve: 8,
        color: 0x224422,
        type: "rocket"
    }

];


// =====================================================
// START
// =====================================================

function startGame() {

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x87CEEB);

    camera =
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth /
            window.innerHeight,
            .1,
            1000
        );

    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(
        renderer.domElement
    );

    const light =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        );

    scene.add(light);

    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            1
        );

    sun.position.set(
        10,
        20,
        10
    );

    scene.add(sun);

    player =
        new THREE.Object3D();

    player.position.set(
        0,
        1.7,
        10
    );

    scene.add(player);

    player.add(camera);

    createGround();
    createMap();
    createGun();
    spawnEnemies();

    setupControls();

    updateWeapon();

    window.addEventListener(
        "resize",
        resize
    );

    animate();

}


// =====================================================
// GROUND
// =====================================================

function createGround() {

    const geometry =
        new THREE.PlaneGeometry(
            100,
            100
        );

    const material =
        new THREE.MeshLambertMaterial({
            color: 0x228B22
        });

    const ground =
        new THREE.Mesh(
            geometry,
            material
        );

    ground.rotation.x =
        -Math.PI / 2;

    scene.add(ground);

}


// =====================================================
// WALLS
// =====================================================

function createWall(
    x,
    z,
    width,
    depth,
    height = 4
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const material =
        new THREE.MeshLambertMaterial({
            color: 0x777777
        });

    const wall =
        new THREE.Mesh(
            geometry,
            material
        );

    wall.position.set(
        x,
        height / 2,
        z
    );

    scene.add(wall);

    walls.push(wall);

}


function createMap() {

    createWall(0,-25,50,1);
    createWall(0,25,50,1);
    createWall(-25,0,1,50);
    createWall(25,0,1,50);

    createWall(-8,0,3,12);
    createWall(8,-5,3,12);
    createWall(0,-10,12,3);
    createWall(-12,-12,5,5);
    createWall(12,8,5,5);

}


// =====================================================
// WEAPON MODEL
// =====================================================

function createGun() {

    gun =
        new THREE.Group();

    gun.position.set(
        .35,
        -.3,
        -.8
    );

    camera.add(gun);

    muzzleFlash =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .15,
                8,
                8
            ),
            new THREE.MeshBasicMaterial({
                color: 0xffff00
            })
        );

    muzzleFlash.visible = false;

    gun.add(
        muzzleFlash
    );

    buildWeaponModel();

}


function clearGun() {

    while (
        gun.children.length > 1
    ) {

        gun.remove(
            gun.children[0]
        );

    }

}


function buildWeaponModel() {

    clearGun();

    const weapon =
        weapons[weaponIndex];

    const material =
        new THREE.MeshLambertMaterial({
            color: weapon.color
        });

    let body;
    let barrel;

    // PISTOL

    if (
        weapon.name ===
        "PISTOL"
    ) {

        body =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .25,
                    .25,
                    .7
                ),
                material
            );

        body.position.z =
            -.35;

        gun.add(body);

        barrel =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .05,
                    .05,
                    .5,
                    12
                ),
                material
            );

        barrel.rotation.x =
            Math.PI / 2;

        barrel.position.z =
            -.8;

        gun.add(barrel);

    }

    // SMG

    else if (
        weapon.name ===
        "SMG"
    ) {

        body =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .3,
                    .3,
                    .8
                ),
                material
            );

        gun.add(body);

        barrel =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .06,
                    .06,
                    .5,
                    12
                ),
                material
            );

        barrel.rotation.x =
            Math.PI / 2;

        barrel.position.z =
            -.65;

        gun.add(barrel);

        const magazine =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .12,
                    .5,
                    .18
                ),
                material
            );

        magazine.position.y =
            -.35;

        gun.add(magazine);

    }

    // ASSAULT RIFLE

    else if (
        weapon.name ===
        "ASSAULT RIFLE"
    ) {

        body =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .35,
                    .35,
                    1
                ),
                material
            );

        gun.add(body);

        barrel =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .055,
                    .055,
                    .8,
                    12
                ),
                material
            );

        barrel.rotation.x =
            Math.PI / 2;

        barrel.position.z =
            -.85;

        gun.add(barrel);

        const stock =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .3,
                    .3,
                    .5
                ),
                material
            );

        stock.position.z =
            .65;

        gun.add(stock);

    }

    // SHOTGUN

    else if (
        weapon.name ===
        "SHOTGUN"
    ) {

        body =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .3,
                    .3,
                    1
                ),
                material
            );

        gun.add(body);

        barrel =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .09,
                    .09,
                    1.2,
                    12
                ),
                material
            );

        barrel.rotation.x =
            Math.PI / 2;

        barrel.position.z =
            -.95;

        gun.add(barrel);

    }

    // SNIPER

    else if (
        weapon.name ===
        "SNIPER"
    ) {

        body =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .28,
                    .28,
                    1.2
                ),
                material
            );

        gun.add(body);

        barrel =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .055,
                    .055,
                    1.6,
                    12
                ),
                material
            );

        barrel.rotation.x =
            Math.PI / 2;

        barrel.position.z =
            -1.3;

        gun.add(barrel);

        const scope =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .07,
                    .07,
                    .4,
                    12
                ),
                material
            );

        scope.rotation.x =
            Math.PI / 2;

        scope.position.y =
            .25;

        gun.add(scope);

    }

    // ROCKET LAUNCHER

    else {

        body =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .25,
                    .25,
                    1.5,
                    12
                ),
                material
            );

        body.rotation.x =
            Math.PI / 2;

        gun.add(body);

    }

    muzzleFlash.position.z =
        -1.5;

}


// =====================================================
// WEAPON SWITCHING
// =====================================================

function updateWeapon() {

    const weapon =
        weapons[weaponIndex];

    document.getElementById(
        "weaponName"
    ).textContent =
        weapon.name;

    document.getElementById(
        "ammo"
    ).textContent =
        weapon.ammo;

    document.getElementById(
        "reserve"
    ).textContent =
        weapon.reserve;

    document.getElementById(
        "damage"
    ).textContent =
        weapon.damage;

    buildWeaponModel();

}


function switchWeapon() {

    if (
        reloading ||
        gameOver
    )
        return;

    weaponIndex++;

    if (
        weaponIndex >=
        weapons.length
    ) {

        weaponIndex = 0;

    }

    reloading = false;

    updateWeapon();

}


// =====================================================
// ROBOT ENEMIES
// =====================================================

function createEnemy(
    x,
    z
) {

    const robot =
        new THREE.Group();

    robot.position.set(
        x,
        0,
        z
    );

    // Body

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.2,
                1.4,
                .8
            ),
            new THREE.MeshLambertMaterial({
                color: 0x555555
            })
        );

    body.position.y =
        1.2;

    robot.add(body);

    // Head

    const head =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .9,
                .7,
                .7
            ),
            new THREE.MeshLambertMaterial({
                color: 0x777777
            })
        );

    head.position.y =
        2.25;

    robot.add(head);

    // Eyes

    const eyeMaterial =
        new THREE.MeshBasicMaterial({
            color: 0xff0000
        });

    const eye1 =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .15,
                .15,
                .05
            ),
            eyeMaterial
        );

    const eye2 =
        eye1.clone();

    eye1.position.set(
        -.2,
        2.3,
        -.36
    );

    eye2.position.set(
        .2,
        2.3,
        -.36
    );

    robot.add(eye1);
    robot.add(eye2);

    // Arms

    const armGeometry =
        new THREE.BoxGeometry(
            .3,
            1.2,
            .3
        );

    const arm1 =
        new THREE.Mesh(
            armGeometry,
            new THREE.MeshLambertMaterial({
                color: 0x444444
            })
        );

    const arm2 =
        arm1.clone();

    arm1.position.set(
        -.8,
        1.2,
        0
    );

    arm2.position.set(
        .8,
        1.2,
        0
    );

    robot.add(arm1);
    robot.add(arm2);

    // Legs

    const legGeometry =
        new THREE.BoxGeometry(
            .35,
            1,
            .35
        );

    const leg1 =
        new THREE.Mesh(
            legGeometry,
            new THREE.MeshLambertMaterial({
                color: 0x333333
            })
        );

    const leg2 =
        leg1.clone();

    leg1.position.set(
        -.3,
        .5,
        0
    );

    leg2.position.set(
        .3,
        .5,
        0
    );

    robot.add(leg1);
    robot.add(leg2);

    // Random robot type

    const type =
        Math.floor(
            Math.random() * 3
        );

    if (
        type === 1
    ) {

        head.scale.set(
            1.3,
            .7,
            .7
        );

        body.scale.set(
            1.3,
            1,
            1
        );

    }

    if (
        type === 2
    ) {

        head.rotation.y =
            Math.PI / 4;

        body.rotation.y =
            Math.PI / 4;

    }

    robot.health =
        100;

    robot.alive =
        true;

    robot.shootTimer =
        Math.random() * 2;

    scene.add(robot);

    enemies.push(robot);

}


function spawnEnemies() {

    const positions = [

        [-10,-10],
        [10,-10],
        [-10,5],
        [10,5],
        [0,-15],
        [-15,10],
        [15,-15]

    ];

    for (
        let pos of positions
    ) {

        createEnemy(
            pos[0],
            pos[1]
        );

    }

}


// =====================================================
// CONTROLS
// =====================================================

function setupControls() {

    const joystick =
        document.getElementById(
            "joystick"
        );

    const stick =
        document.getElementById(
            "stick"
        );

    joystick.addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            joystickTouch =
                e.changedTouches[0]
                .identifier;

        },
        { passive:false }
    );

    joystick.addEventListener(
        "touchmove",
        function(e) {

            e.preventDefault();

            let touch =
                [...e.touches].find(
                    t =>
                    t.identifier ===
                    joystickTouch
                );

            if (!touch)
                return;

            const rect =
                joystick.getBoundingClientRect();

            let x =
                touch.clientX -
                (
                    rect.left +
                    rect.width / 2
                );

            let y =
                touch.clientY -
                (
                    rect.top +
                    rect.height / 2
                );

            let max = 40;

            let distance =
                Math.sqrt(
                    x*x +
                    y*y
                );

            if (
                distance > max
            ) {

                x =
                    x /
                    distance *
                    max;

                y =
                    y /
                    distance *
                    max;

            }

            joyX =
                x / max;

            joyY =
                y / max;

            stick.style.transform =
                `translate(${x}px,${y}px)`;

        },
        { passive:false }
    );

    joystick.addEventListener(
        "touchend",
        function() {

            joystickTouch =
                null;

            joyX = 0;
            joyY = 0;

            stick.style.transform =
                "translate(0,0)";

        }
    );


    // AIM

    renderer.domElement.addEventListener(
        "touchstart",
        function(e) {

            for (
                let touch of
                e.changedTouches
            ) {

                if (
                    touch.clientX >
                    window.innerWidth / 2
                ) {

                    aimTouch =
                        touch.identifier;

                    lastAimX =
                        touch.clientX;

                    lastAimY =
                        touch.clientY;

                }

            }

        }
    );


    renderer.domElement.addEventListener(
        "touchmove",
        function(e) {

            for (
                let touch of
                e.changedTouches
            ) {

                if (
                    touch.identifier ===
                    aimTouch
                ) {

                    let dx =
                        touch.clientX -
                        lastAimX;

                    let dy =
                        touch.clientY -
                        lastAimY;

                    rotationY -=
                        dx * .004;

                    rotationX -=
                        dy * .004;

                    rotationX =
                        Math.max(
                            -1.3,
                            Math.min(
                                1.3,
                                rotationX
                            )
                        );

                    player.rotation.y =
                        rotationY;

                    camera.rotation.x =
                        rotationX;

                    lastAimX =
                        touch.clientX;

                    lastAimY =
                        touch.clientY;

                }

            }

        }
    );


    renderer.domElement.addEventListener(
        "touchend",
        function(e) {

            for (
                let touch of
                e.changedTouches
            ) {

                if (
                    touch.identifier ===
                    aimTouch
                ) {

                    aimTouch =
                        null;

                }

            }

        }
    );


    // FIRE

    const fireButton =
        document.getElementById(
            "fire"
        );

    fireButton.addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            firing = true;

            shoot();

        },
        { passive:false }
    );

    fireButton.addEventListener(
        "touchend",
        function() {

            firing = false;

        }
    );


    // RELOAD

    document.getElementById(
        "reload"
    ).addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            reload();

        },
        { passive:false }
    );


    // SWITCH

    document.getElementById(
        "switchWeapon"
    ).addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            switchWeapon();

        },
        { passive:false }
    );


    // SPRINT

    const sprintButton =
        document.getElementById(
            "sprint"
        );

    sprintButton.addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            sprinting = true;

        },
        { passive:false }
    );

    sprintButton.addEventListener(
        "touchend",
        function() {

            sprinting = false;

        }
    );


    document.getElementById(
        "restart"
    ).addEventListener(
        "click",
        function() {

            location.reload();

        }
    );

}


// =====================================================
// COLLISION
// =====================================================

function checkCollision(
    position
) {

    const playerBox =
        new THREE.Box3();

    playerBox.setFromCenterAndSize(
        position,
        new THREE.Vector3(
            .8,
            2,
            .8
        )
    );

    for (
        let wall of walls
    ) {

        const wallBox =
            new THREE.Box3()
            .setFromObject(wall);

        if (
            playerBox.intersectsBox(
                wallBox
            )
        ) {

            return true;

        }

    }

    return false;

}


function checkWallCollision(
    oldPosition,
    newPosition
) {

    const box =
        new THREE.Box3();

    box.setFromCenterAndSize(
        newPosition,
        new THREE.Vector3(
            1,
            2,
            1
        )
    );

    for (
        let wall of walls
    ) {

        const wallBox =
            new THREE.Box3()
            .setFromObject(wall);

        if (
            box.intersectsBox(
                wallBox
            )
        ) {

            return true;

        }

    }

    return false;

}


// =====================================================
// MOVEMENT
// =====================================================

function movePlayer(
    delta
) {

    if (gameOver)
        return;

    let speed =
        sprinting
        ? 10
        : 5;

    let forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    let right =
        new THREE.Vector3(
            1,
            0,
            0
        );

    forward.applyQuaternion(
        player.quaternion
    );

    right.applyQuaternion(
        player.quaternion
    );

    forward.y = 0;
    right.y = 0;

    forward.normalize();
    right.normalize();

    let movement =
        new THREE.Vector3();

    movement.add(
        forward.multiplyScalar(
            -joyY
        )
    );

    movement.add(
        right.multiplyScalar(
            joyX
        )
    );

    if (
        movement.length() > 0
    ) {

        movement.normalize();

        let move =
            movement.multiplyScalar(
                speed * delta
            );

        let testX =
            player.position.clone();

        testX.x +=
            move.x;

        if (
            !checkCollision(testX)
        ) {

            player.position.x =
                testX.x;

        }

        let testZ =
            player.position.clone();

        testZ.z +=
            move.z;

        if (
            !checkCollision(testZ)
        ) {

            player.position.z =
                testZ.z;

        }

    }

}


// =====================================================
// SHOOTING
// =====================================================

function shoot() {

    if (
        gameOver ||
        reloading
    )
        return;

    const weapon =
        weapons[weaponIndex];

    const now =
        performance.now();

    if (
        now -
        lastShot <
        weapon.fireRate
    )
        return;

    lastShot =
        now;

    if (
        weapon.ammo <= 0
    ) {

        reload();

        return;

    }

    weapon.ammo--;

    updateWeapon();

    muzzleFlash.visible =
        true;

    setTimeout(
        function() {

            muzzleFlash.visible =
                false;

        },
        60
    );


    // SHOTGUN

    if (
        weapon.type ===
        "shotgun"
    ) {

        for (
            let i = 0;
            i < 8;
            i++
        ) {

            fireRay(
                weapon.damage,
                (
                    Math.random() -
                    .5
                ) * .12,
                (
                    Math.random() -
                    .5
                ) * .12
            );

        }

    }

    // ROCKET

    else if (
        weapon.type ===
        "rocket"
    ) {

        fireRocket();

    }

    // NORMAL

    else {

        fireRay(
            weapon.damage,
            0,
            0
        );

    }

}


function fireRay(
    damage,
    spreadX,
    spreadY
) {

    const raycaster =
        new THREE.Raycaster();

    raycaster.setFromCamera(
        new THREE.Vector2(
            spreadX,
            spreadY
        ),
        camera
    );

    const targets =
        enemies.filter(
            e =>
            e.alive
        );

    const hits =
        raycaster.intersectObjects(
            targets,
            true
        );

    if (
        hits.length > 0
    ) {

        let object =
            hits[0].object;

        let enemy =
            object;

        while (
            enemy.parent &&
            !enemy.health
        ) {

            enemy =
                enemy.parent;

        }

        if (
            enemy.health !== undefined
        ) {

            enemy.health -=
                damage;

            showHitMarker();

            if (
                enemy.health <= 0
            ) {

                killEnemy(
                    enemy
                );

            }

        }

    }

}


// =====================================================
// ROCKET EXPLOSION
// =====================================================

function fireRocket() {

    const raycaster =
        new THREE.Raycaster();

    raycaster.setFromCamera(
        new THREE.Vector2(
            0,
            0
        ),
        camera
    );

    const targets =
        enemies.filter(
            e =>
            e.alive
        );

    const hits =
        raycaster.intersectObjects(
            targets,
            true
        );

    if (
        hits.length > 0
    ) {

        let enemy =
            hits[0].object;

        while (
            enemy.parent &&
            !enemy.health
        ) {

            enemy =
                enemy.parent;

        }

        if (
            enemy.health !== undefined
        ) {

            const explosionPosition =
                enemy.position.clone();

            for (
                let target of
                enemies
            ) {

                if (
                    !target.alive
                )
                    continue;

                const distance =
                    target.position.distanceTo(
                        explosionPosition
                    );

                if (
                    distance < 5
                ) {

                    target.health -=
                        100 *
                        (
                            1 -
                            distance / 5
                        );

                    if (
                        target.health <= 0
                    ) {

                        killEnemy(
                            target
                        );

                    }

                }

            }

        }

    }

}


// =====================================================
// KILL ENEMY
// =====================================================

function killEnemy(
    enemy
) {

    if (
        !enemy.alive
    )
        return;

    enemy.alive =
        false;

    scene.remove(
        enemy
    );

    kills++;

    updateHUD();

    if (
        enemies.every(
            e =>
            !e.alive
        )
    ) {

        winGame();

    }

}


// =====================================================
// RELOAD
// =====================================================

function reload() {

    const weapon =
        weapons[weaponIndex];

    if (
        reloading ||
        weapon.ammo >=
        weapon.magazine ||
        weapon.reserve <= 0
    )
        return;

    reloading =
        true;

    document.getElementById(
        "reload"
    ).textContent =
        "RELOADING";

    setTimeout(
        function() {

            const needed =
                weapon.magazine -
                weapon.ammo;

            const amount =
                Math.min(
                    needed,
                    weapon.reserve
                );

            weapon.ammo +=
                amount;

            weapon.reserve -=
                amount;

            reloading =
                false;

            document.getElementById(
                "reload"
            ).textContent =
                "RELOAD";

            updateWeapon();

        },
        1000
    );

}


// =====================================================
// ENEMY AI
// =====================================================

function updateEnemies(
    delta
) {

    if (gameOver)
        return;

    for (
        let enemy of
        enemies
    ) {

        if (
            !enemy.alive
        )
            continue;

        let direction =
            new THREE.Vector3();

        direction.subVectors(
            player.position,
            enemy.position
        );

        direction.y = 0;

        const distance =
            direction.length();

        if (
            distance > 7
        ) {

            direction.normalize();

            const movement =
                direction.multiplyScalar(
                    delta * 1.2
                );

            const test =
                enemy.position.clone();

            test.add(
                movement
            );

            if (
                !checkWallCollision(
                    enemy.position,
                    test
                )
            ) {

                enemy.position.copy(
                    test
                );

            }

        }

        // Robot faces player

        enemy.lookAt(
            player.position.x,
            enemy.position.y,
            player.position.z
        );

        enemy.shootTimer -=
            delta;

        if (
            distance < 25 &&
            enemy.shootTimer <= 0
        ) {

            enemy.shootTimer =
                2 +
                Math.random() * 2;

            enemyShoot(
                enemy
            );

        }

    }

}


// =====================================================
// ENEMY SHOOTING
// =====================================================

function enemyShoot(
    enemy
) {

    if (gameOver)
        return;

    const direction =
        new THREE.Vector3();

    direction.subVectors(
        player.position,
        enemy.position
    );

    direction.normalize();

    const raycaster =
        new THREE.Raycaster(
            enemy.position,
            direction
        );

    const hits =
        raycaster.intersectObject(
            player,
            true
        );

    if (
        hits.length > 0
    ) {

        takeDamage(
            10
        );

    }

}


// =====================================================
// DAMAGE
// =====================================================

function takeDamage(
    damage
) {

    if (gameOver)
        return;

    health -=
        damage;

    health =
        Math.max(
            0,
            health
        );

    updateHUD();

    const flash =
        document.getElementById(
            "damageFlash"
        );

    flash.style.opacity =
        1;

    setTimeout(
        function() {

            flash.style.opacity =
                0;

        },
        150
    );

    if (
        health <= 0
    ) {

        loseGame();

    }

}


// =====================================================
// HIT MARKER
// =====================================================

function showHitMarker() {

    const marker =
        document.getElementById(
            "hitMarker"
        );

    marker.style.opacity =
        1;

    setTimeout(
        function() {

            marker.style.opacity =
                0;

        },
        100
    );

}


// =====================================================
// HUD
// =====================================================

function updateHUD() {

    const weapon =
        weapons[weaponIndex];

    document.getElementById(
        "ammo"
    ).textContent =
        weapon.ammo;

    document.getElementById(
        "reserve"
    ).textContent =
        weapon.reserve;

    document.getElementById(
        "damage"
    ).textContent =
        weapon.damage;

    document.getElementById(
        "kills"
    ).textContent =
        kills;

    document.getElementById(
        "enemyCount"
    ).textContent =
        enemies.filter(
            e =>
            e.alive
        ).length;

    document.getElementById(
        "health"
    ).style.width =
        health +
        "%";

}


// =====================================================
// MINIMAP
// =====================================================

function updateMinimap() {

    const canvas =
        document.getElementById(
            "minimap"
        );

    const ctx =
        canvas.getContext(
            "2d"
        );

    ctx.clearRect(
        0,
        0,
        150,
        150
    );

    ctx.fillStyle =
        "#333";

    ctx.fillRect(
        0,
        0,
        150,
        150
    );

    ctx.strokeStyle =
        "#555";

    for (
        let i = 0;
        i <= 150;
        i += 25
    ) {

        ctx.beginPath();

        ctx.moveTo(
            i,
            0
        );

        ctx.lineTo(
            i,
            150
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            0,
            i
        );

        ctx.lineTo(
            150,
            i
        );

        ctx.stroke();

    }

    for (
        let enemy of
        enemies
    ) {

        if (
            !enemy.alive
        )
            continue;

        ctx.fillStyle =
            "red";

        ctx.beginPath();

        ctx.arc(
            75 +
            enemy.position.x * 3,
            75 +
            enemy.position.z * 3,
            5,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    ctx.fillStyle =
        "lime";

    ctx.beginPath();

    ctx.arc(
        75 +
        player.position.x * 3,
        75 +
        player.position.z * 3,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


// =====================================================
// WIN / LOSE
// =====================================================

function winGame() {

    gameOver =
        true;

    document.getElementById(
        "messageText"
    ).textContent =
        "YOU WIN!";

    document.getElementById(
        "message"
    ).style.display =
        "block";

}


function loseGame() {

    gameOver =
        true;

    document.getElementById(
        "messageText"
    ).textContent =
        "GAME OVER";

    document.getElementById(
        "message"
    ).style.display =
        "block";

}


// =====================================================
// RESIZE
// =====================================================

function resize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


// =====================================================
// GAME LOOP
// =====================================================

let lastTime =
    performance.now();

function animate() {

    requestAnimationFrame(
        animate
    );

    const now =
        performance.now();

    let delta =
        (
            now -
            lastTime
        ) / 1000;

    lastTime =
        now;

    delta =
        Math.min(
            delta,
            .1
        );

    movePlayer(
        delta
    );

    updateEnemies(
        delta
    );

    // Automatic weapons

    if (
        firing &&
        (
            weapons[weaponIndex].type ===
            "automatic"
        )
    ) {

        shoot();

    }

    updateMinimap();

    renderer.render(
        scene,
        camera
    );

}


// =====================================================
// START GAME
// =====================================================

startGame();

</script>
