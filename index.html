<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mobile FPS V6.1</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #87CEEB;

    touch-action: none;

    font-family: Arial, sans-serif;

}

canvas {
    display: block;
}


/* =========================
   HUD
========================= */

#hud {

    position: fixed;

    top: 15px;
    left: 15px;

    color: white;

    font-size: 16px;

    font-weight: bold;

    text-shadow:
        2px 2px 4px black;

    z-index: 20;

}

#healthBar {

    width: 180px;

    height: 20px;

    margin-top: 4px;

    border: 2px solid white;

    background: #333;

}

#health {

    width: 100%;

    height: 100%;

    background: lime;

    transition:
        width 0.2s;

}

.stat {
    margin-top: 5px;
}


/* =========================
   CROSSHAIR
========================= */

#crosshair {

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-size: 30px;

    font-weight: bold;

    text-shadow:
        2px 2px 5px black;

    pointer-events: none;

    z-index: 10;

}


/* =========================
   HIT MARKER
========================= */

#hitMarker {

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-size: 35px;

    font-weight: bold;

    opacity: 0;

    pointer-events: none;

    z-index: 15;

}


/* =========================
   DAMAGE FLASH
========================= */

#damageFlash {

    position: fixed;

    inset: 0;

    background:
        rgba(255, 0, 0, 0.3);

    opacity: 0;

    pointer-events: none;

    z-index: 14;

}


/* =========================
   JOYSTICK
========================= */

#joystick {

    position: fixed;

    left: 25px;

    bottom: 30px;

    width: 130px;

    height: 130px;

    border-radius: 50%;

    background:
        rgba(255, 255, 255, 0.2);

    border:
        3px solid
        rgba(255, 255, 255, 0.5);

    z-index: 30;

}

#stick {

    position: absolute;

    width: 50px;

    height: 50px;

    left: 40px;

    top: 40px;

    border-radius: 50%;

    background:
        rgba(255, 255, 255, 0.7);

}


/* =========================
   FIRE
========================= */

#fire {

    position: fixed;

    right: 25px;

    bottom: 35px;

    width: 90px;

    height: 90px;

    border-radius: 50%;

    background: red;

    color: white;

    border:
        3px solid white;

    font-size: 17px;

    font-weight: bold;

    z-index: 30;

}


/* =========================
   RELOAD
========================= */

#reload {

    position: fixed;

    right: 35px;

    bottom: 145px;

    width: 80px;

    height: 45px;

    border-radius: 8px;

    background: black;

    color: white;

    border:
        2px solid white;

    z-index: 30;

}


/* =========================
   SPRINT
========================= */

#sprint {

    position: fixed;

    left: 170px;

    bottom: 45px;

    width: 75px;

    height: 55px;

    border-radius: 12px;

    background:
        rgba(0, 0, 0, 0.7);

    color: white;

    border:
        2px solid white;

    font-weight: bold;

    z-index: 30;

}


/* =========================
   WEAPON BUTTONS
========================= */

#weaponButtons {

    position: fixed;

    top: 175px;

    left: 15px;

    display: flex;

    flex-direction: column;

    gap: 5px;

    z-index: 30;

}

.weaponButton {

    width: 100px;

    height: 35px;

    background:
        rgba(0, 0, 0, 0.7);

    color: white;

    border:
        2px solid white;

    border-radius: 6px;

    font-size: 12px;

}

.weaponButton.active {

    background:
        rgba(0, 150, 255, 0.8);

}


/* =========================
   MINIMAP
========================= */

#minimap {

    position: fixed;

    top: 15px;

    right: 15px;

    width: 150px;

    height: 150px;

    background:
        rgba(0, 0, 0, 0.65);

    border:
        2px solid white;

    z-index: 25;

}


/* =========================
   GAME OVER
========================= */

#message {

    position: fixed;

    top: 50%;

    left: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-size: 38px;

    font-weight: bold;

    text-align: center;

    text-shadow:
        3px 3px 7px black;

    z-index: 100;

    display: none;

}

#restart {

    margin-top: 20px;

    padding:
        12px 25px;

    background: black;

    color: white;

    border:
        2px solid white;

    border-radius: 8px;

    font-size: 18px;

}

</style>

</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =====================================================
   GAME VARIABLES
===================================================== */

let scene;

let camera;

let renderer;

let player;

let gun;

let muzzleFlash;

let enemies = [];

let walls = [];

let bullets = [];

let projectileEffects = [];

let health = 100;

let kills = 0;

let gameOver = false;

let sprinting = false;

let reloading = false;

let lastShot = 0;

let playerVelocity =
    new THREE.Vector3();

let lastPlayerPosition =
    new THREE.Vector3();

let playerVelocityInitialized =
    false;


/* =====================================================
   CONTROLS
===================================================== */

let joyX = 0;

let joyY = 0;

let joystickTouch = null;

let aimTouch = null;

let lastAimX = 0;

let lastAimY = 0;

let rotationY = 0;

let rotationX = 0;


/* =====================================================
   ENEMY STATES
===================================================== */

const ENEMY_STATES = {

    PATROL:
        "patrol",

    ALERT:
        "alert",

    CHASE:
        "chase",

    ATTACK:
        "attack",

    RETREAT:
        "retreat",

    SEARCH:
        "search"

};


/* =====================================================
   WEAPONS
===================================================== */

const weapons = {

    pistol: {

        name:
            "Pistol",

        damage:
            30,

        fireRate:
            300,

        magazineSize:
            12,

        ammo:
            12,

        reserve:
            120

    },


    smg: {

        name:
            "SMG",

        damage:
            15,

        fireRate:
            90,

        magazineSize:
            30,

        ammo:
            30,

        reserve:
            180

    },


    assault: {

        name:
            "Assault Rifle",

        damage:
            25,

        fireRate:
            130,

        magazineSize:
            30,

        ammo:
            30,

        reserve:
            180

    },


    sniper: {

        name:
            "Sniper",

        damage:
            100,

        fireRate:
            900,

        magazineSize:
            5,

        ammo:
            5,

        reserve:
            40

    }

};


let currentWeapon =
    "pistol";


/* =====================================================
   ENEMY TYPES
===================================================== */

const enemyTypes = {

    scout: {

        name:
            "Scout",

        health:
            70,

        damage:
            5,

        speed:
            5,

        fireRate:
            700,

        attackRange:
            35,

        detectionRange:
            120,

        accuracy:
            0.10,

        color:
            0x00ffff

    },


    soldier: {

        name:
            "Soldier",

        health:
            120,

        damage:
            8,

        speed:
            3.2,

        fireRate:
            1000,

        attackRange:
            50,

        detectionRange:
            140,

        accuracy:
            0.06,

        color:
            0xff8800

    },


    heavy: {

        name:
            "Heavy",

        health:
            300,

        damage:
            18,

        speed:
            1.7,

        fireRate:
            1800,

        attackRange:
            65,

        detectionRange:
            160,

        accuracy:
            0.04,

        color:
            0xff0000

    }

};


/* =====================================================
   START
===================================================== */

function startGame() {

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x87CEEB
        );


    camera =
        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /
            window.innerHeight,

            0.1,

            1000

        );


    renderer =
        new THREE.WebGLRenderer({

            antialias:
                true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    document.body.appendChild(

        renderer.domElement

    );


    const light =
        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            2

        );


    scene.add(
        light
    );


    const directionalLight =
        new THREE.DirectionalLight(

            0xffffff,

            1

        );


    directionalLight.position.set(

        50,
        100,
        50

    );


    scene.add(
        directionalLight
    );


    player =
        new THREE.Object3D();


    player.position.set(

        0,
        1.7,
        100

    );


    scene.add(
        player
    );


    player.add(
        camera
    );


    createGround();

    createMap();

    createGun();

    spawnEnemies();

    setupControls();

    updateHUD();


    window.addEventListener(

        "resize",

        resize

    );


    lastPlayerPosition.copy(
        player.position
    );


    animate();

}


/* =====================================================
   GROUND
===================================================== */

function createGround() {

    const geometry =
        new THREE.PlaneGeometry(

            250,
            250

        );


    const material =
        new THREE.MeshLambertMaterial({

            color:
                0x228B22

        });


    const ground =
        new THREE.Mesh(

            geometry,

            material

        );


    ground.rotation.x =
        -Math.PI / 2;


    scene.add(
        ground
    );

}


/* =====================================================
   WALL
===================================================== */

function createWall(

    x,

    z,

    width,

    depth,

    height = 4

) {

    const geometry =
        new THREE.BoxGeometry(

            width,
            height,
            depth

        );


    const material =
        new THREE.MeshLambertMaterial({

            color:
                0x777777

        });


    const wall =
        new THREE.Mesh(

            geometry,

            material

        );


    wall.position.set(

        x,
        height / 2,
        z

    );


    scene.add(
        wall
    );


    walls.push(
        wall
    );


    return wall;

}


/* =====================================================
   LARGE 250 x 250 MAP
===================================================== */

function createMap() {

    const mapSize =
        250;


    createWall(

        0,
        -125,
        mapSize,
        2

    );


    createWall(

        0,
        125,
        mapSize,
        2

    );


    createWall(

        -125,
        0,
        2,
        mapSize

    );


    createWall(

        125,
        0,
        2,
        mapSize

    );


    /* CENTRAL COVER */

    createWall(
        0,
        0,
        25,
        4
    );


    createWall(
        -40,
        -30,
        30,
        4
    );


    createWall(
        45,
        35,
        35,
        4
    );


    createWall(
        -55,
        50,
        4,
        35
    );


    createWall(
        55,
        -55,
        4,
        40
    );


    createWall(
        -80,
        -70,
        15,
        15
    );


    createWall(
        80,
        70,
        15,
        15
    );


    createWall(
        -85,
        20,
        20,
        5
    );


    createWall(
        75,
        -20,
        25,
        5
    );


    createWall(
        20,
        80,
        30,
        5
    );


    createWall(
        -20,
        -80,
        30,
        5
    );

}


/* =====================================================
   WEAPON MODEL
===================================================== */

function clearWeaponModel() {

    while (

        gun.children.length >
        0

    ) {

        gun.remove(

            gun.children[0]

        );

    }


    muzzleFlash =
        null;

}


function createGun() {

    gun =
        new THREE.Group();


    gun.position.set(

        0.35,
        -0.3,
        -0.8

    );


    camera.add(
        gun
    );


    createWeaponModel(

        currentWeapon

    );

}


function createWeaponModel(

    weaponName

) {

    clearWeaponModel();


    const group =
        new THREE.Group();


    gun.add(
        group
    );


    const metalMaterial =
        new THREE.MeshLambertMaterial({

            color:
                0x222222

        });


    const darkMaterial =
        new THREE.MeshLambertMaterial({

            color:
                0x111111

        });


    if (
        weaponName ===
        "pistol"
    ) {

        const body =
            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.25,
                    0.25,
                    0.7

                ),

                metalMaterial

            );


        group.add(
            body
        );


        const grip =
            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.18,
                    0.45,
                    0.2

                ),

                darkMaterial

            );


        grip.position.set(

            0,
            -0.28,
            0.15

        );


        group.add(
            grip
        );


        const barrel =
            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.045,
                    0.045,
                    0.35,
                    12

                ),

                darkMaterial

            );


        barrel.rotation.x =
            Math.PI / 2;


        barrel.position.z =
            -0.52;


        group.add(
            barrel
        );

    }


    if (
        weaponName ===
        "smg"
    ) {

        const body =
            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.28,
                    0.3,
                    1.0

                ),

                metalMaterial

            );


        group.add(
            body
        );


        const magazine =
            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.15,
                    0.5,
                    0.25

                ),

                darkMaterial

            );


        magazine.position.set(

            0,
            -0.35,
            0.05

        );


        group.add(
            magazine
        );


        const barrel =
            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.055,
                    0.055,
                    0.6,
                    12

                ),

                darkMaterial

            );


        barrel.rotation.x =
            Math.PI / 2;


        barrel.position.z =
            -0.8;


        group.add(
            barrel
        );

    }


    if (
        weaponName ===
        "assault"
    ) {

        const body =
            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.32,
                    0.35,
                    1.3

                ),

                metalMaterial

            );


        group.add(
            body
        );


        const magazine =
            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.18,
                    0.55,
                    0.3

                ),

                darkMaterial

            );


        magazine.position.set(

            0,
            -0.4,
            0.1

        );


        group.add(
            magazine
        );


        const barrel =
            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.055,
                    0.055,
                    1.0,
                    12

                ),

                darkMaterial

            );


        barrel.rotation.x =
            Math.PI / 2;


        barrel.position.z =
            -1.15;


        group.add(
            barrel
        );

    }


    if (
        weaponName ===
        "sniper"
    ) {

        const body =
            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.3,
                    0.32,
                    1.5

                ),

                metalMaterial

            );


        group.add(
            body
        );


        const barrel =
            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.06,
                    0.06,
                    1.8,
                    16

                ),

                darkMaterial

            );


        barrel.rotation.x =
            Math.PI / 2;


        barrel.position.z =
            -1.6;


        group.add(
            barrel
        );


        const scope =
            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.08,
                    0.08,
                    0.5,
                    12

                ),

                darkMaterial

            );


        scope.rotation.x =
            Math.PI / 2;


        scope.position.set(

            0,
            0.25,
            -0.2

        );


        group.add(
            scope
        );

    }


    const flashGeometry =
        new THREE.SphereGeometry(

            0.18,
            8,
            8

        );


    const flashMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0xffff00

        });


    muzzleFlash =
        new THREE.Mesh(

            flashGeometry,

            flashMaterial

        );


    muzzleFlash.position.z =

        weaponName ===
        "sniper"

        ? -2.5

        :

        weaponName ===
        "assault"

        ? -1.6

        :

        weaponName ===
        "smg"

        ? -1.2

        :

        -0.8;


    muzzleFlash.visible =
        false;


    group.add(
        muzzleFlash
    );

}


/* =====================================================
   ENEMY SPAWN
===================================================== */

function spawnEnemies() {

    const positions = [

        [-100, -100],
        [100, -100],
        [-100, 0],
        [100, 0],
        [-70, 80],
        [70, 80],
        [0, -100],
        [-40, 100],
        [40, -80],
        [90, 40],
        [-90, 40],
        [0, 70]

    ];


    const types = [

        "scout",
        "soldier",
        "soldier",
        "heavy",
        "scout",
        "soldier",
        "heavy",
        "scout",
        "soldier",
        "heavy",
        "scout",
        "soldier"

    ];


    for (

        let i = 0;

        i < positions.length;

        i++

    ) {

        createEnemy(

            positions[i][0],

            positions[i][1],

            types[i]

        );

    }


    updateHUD();

}


/* =====================================================
   CREATE ENEMY
===================================================== */

function createEnemy(

    x,

    z,

    typeName

) {

    const type =
        enemyTypes[typeName];


    const enemy =
        new THREE.Group();


    enemy.position.set(

        x,
        0,
        z

    );


    enemy.state =
        ENEMY_STATES.PATROL;


    enemy.stateTimer =
        0;


    enemy.alertTimer =
        0;


    enemy.searchTimer =
        0;


    enemy.lastKnownPlayerPosition =
        new THREE.Vector3();


    enemy.patrolTarget =
        new THREE.Vector3(

            x,
            0,
            z

        );


    enemy.patrolTimer =
        Math.random() *
        5;


    enemy.preferredDistance =
        type.attackRange;


    enemy.shootTimer =
        Math.random() *
        type.fireRate;


    const bodyMaterial =
        new THREE.MeshLambertMaterial({

            color:
                type.color

        });


    const darkMaterial =
        new THREE.MeshLambertMaterial({

            color:
                0x111111

        });


    const eyeMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0xffff00

        });


    let bodySize =
        1.5;


    if (
        typeName ===
        "scout"
    )
        bodySize =
            1.2;


    if (
        typeName ===
        "soldier"
    )
        bodySize =
            1.6;


    if (
        typeName ===
        "heavy"
    )
        bodySize =
            2.4;


    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                bodySize,
                bodySize * 1.3,
                bodySize

            ),

            bodyMaterial

        );


    body.position.y =
        bodySize * 0.8;


    enemy.add(
        body
    );


    const head =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                bodySize * 0.75,
                bodySize * 0.6,
                bodySize * 0.75

            ),

            bodyMaterial

        );


    head.position.y =
        bodySize * 1.75;


    enemy.add(
        head
    );


    const eye =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                bodySize * 0.4,
                bodySize * 0.15,
                bodySize * 0.05

            ),

            eyeMaterial

        );


    eye.position.set(

        0,
        bodySize * 1.8,
        -bodySize * 0.38

    );


    enemy.add(
        eye
    );


    const legGeometry =
        new THREE.BoxGeometry(

            bodySize * 0.25,
            bodySize * 0.9,
            bodySize * 0.25

        );


    const leftLeg =
        new THREE.Mesh(

            legGeometry,
            bodyMaterial

        );


    leftLeg.position.set(

        -bodySize * 0.3,
        bodySize * 0.2,
        0

    );


    enemy.add(
        leftLeg
    );


    const rightLeg =
        leftLeg.clone();


    rightLeg.position.x =
        bodySize * 0.3;


    enemy.add(
        rightLeg
    );


    const weaponGroup =
        new THREE.Group();


    weaponGroup.position.set(

        0,
        bodySize * 0.9,
        -bodySize * 0.7

    );


    enemy.add(
        weaponGroup
    );


    let weaponLength =
        1.5;


    if (
        typeName ===
        "scout"
    )
        weaponLength =
            1.1;


    if (
        typeName ===
        "heavy"
    )
        weaponLength =
            2.6;


    const enemyWeapon =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                0.3,
                0.3,
                weaponLength

            ),

            darkMaterial

        );


    enemyWeapon.position.z =

        -weaponLength /
        2;


    weaponGroup.add(
        enemyWeapon
    );


    const muzzleFlash =
        new THREE.Mesh(

            new THREE.SphereGeometry(

                0.15,
                8,
                8

            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xffff00

            })

        );


    muzzleFlash.position.z =

        -weaponLength -
        0.25;


    muzzleFlash.visible =
        false;


    weaponGroup.add(
        muzzleFlash
    );


    enemy.type =
        typeName;


    enemy.stats =
        type;


    enemy.health =
        type.health;


    enemy.maxHealth =
        type.health;


    enemy.alive =
        true;


    enemy.body =
        body;


    enemy.head =
        head;


    enemy.leftLeg =
        leftLeg;


    enemy.rightLeg =
        rightLeg;


    enemy.weaponGroup =
        weaponGroup;


    enemy.muzzleFlash =
        muzzleFlash;


    enemy.walkTime =
        Math.random() *
        10;


    scene.add(
        enemy
    );


    enemies.push(
        enemy
    );


    return enemy;

}


/* =====================================================
   CONTROLS
===================================================== */

function setupControls() {

    const joystick =
        document.getElementById(
            "joystick"
        );


    const stick =
        document.getElementById(
            "stick"
        );


    joystick.addEventListener(

        "touchstart",

        function(e) {

            e.preventDefault();

            joystickTouch =
                e.changedTouches[0]
                    .identifier;

        },

        {
            passive:
                false
        }

    );


    joystick.addEventListener(

        "touchmove",

        function(e) {

            e.preventDefault();


            const touch =

                [...e.touches]
                    .find(

                        t =>

                            t.identifier ===
                            joystickTouch

                    );


            if (!touch)
                return;


            const rect =
                joystick
                    .getBoundingClientRect();


            let x =

                touch.clientX -

                (
                    rect.left +
                    rect.width / 2
                );


            let y =

                touch.clientY -

                (
                    rect.top +
                    rect.height / 2
                );


            const max =
                40;


            const distance =

                Math.sqrt(

                    x * x +
                    y * y

                );


            if (
                distance > max
            ) {

                x =
                    x /
                    distance *
                    max;


                y =
                    y /
                    distance *
                    max;

            }


            joyX =
                x /
                max;


            joyY =
                y /
                max;


            stick.style.transform =

                `translate(${x}px, ${y}px)`;

        },

        {
            passive:
                false
        }

    );


    joystick.addEventListener(

        "touchend",

        function() {

            joystickTouch =
                null;


            joyX =
                0;


            joyY =
                0;


            stick.style.transform =
                "translate(0,0)";

        }

    );


    renderer.domElement.addEventListener(

        "touchstart",

        function(e) {

            for (

                let touch of
                e.changedTouches

            ) {

                if (

                    touch.clientX >
                    window.innerWidth /
                    2

                ) {

                    aimTouch =
                        touch.identifier;


                    lastAimX =
                        touch.clientX;


                    lastAimY =
                        touch.clientY;

                }

            }

        }

    );


    renderer.domElement.addEventListener(

        "touchmove",

        function(e) {

            for (

                let touch of
                e.changedTouches

            ) {

                if (

                    touch.identifier ===
                    aimTouch

                ) {

                    const dx =

                        touch.clientX -
                        lastAimX;


                    const dy =

                        touch.clientY -
                        lastAimY;


                    rotationY -=

                        dx *
                        0.004;


                    rotationX -=

                        dy *
                        0.004;


                    rotationX =

                        Math.max(

                            -1.3,

                            Math.min(

                                1.3,

                                rotationX

                            )

                        );


                    player.rotation.y =
                        rotationY;


                    camera.rotation.x =
                        rotationX;


                    lastAimX =
                        touch.clientX;


                    lastAimY =
                        touch.clientY;

                }

            }

        }

    );


    renderer.domElement.addEventListener(

        "touchend",

        function(e) {

            for (

                let touch of
                e.changedTouches

            ) {

                if (

                    touch.identifier ===
                    aimTouch

                ) {

                    aimTouch =
                        null;

                }

            }

        }

    );


    document
        .getElementById("fire")
        .addEventListener(

            "touchstart",

            function(e) {

                e.preventDefault();

                shoot();

            },

            {
                passive:
                    false
            }

        );


    document
        .getElementById("reload")
        .addEventListener(

            "touchstart",

            function(e) {

                e.preventDefault();

                reload();

            },

            {
                passive:
                    false
            }

        );


    const sprintButton =
        document.getElementById(
            "sprint"
        );


    sprintButton.addEventListener(

        "touchstart",

        function(e) {

            e.preventDefault();

            sprinting =
                true;

        },

        {
            passive:
                false
        }

    );


    sprintButton.addEventListener(

        "touchend",

        function() {

            sprinting =
                false;

        }

    );


    document
        .querySelectorAll(
            ".weaponButton"
        )
        .forEach(

            button => {

                button.addEventListener(

                    "touchstart",

                    function(e) {

                        e.preventDefault();


                        switchWeapon(

                            button.dataset.weapon

                        );

                    },

                    {
                        passive:
                            false
                    }

                );

            }

        );


    document
        .getElementById("restart")
        .addEventListener(

            "click",

            function() {

                location.reload();

            }

        );

}


/* =====================================================
   WEAPON SWITCH
===================================================== */

function switchWeapon(

    weaponName

) {

    if (
        !weapons[weaponName]
    )
        return;


    if (
        reloading
    )
        return;


    currentWeapon =
        weaponName;


    createWeaponModel(

        currentWeapon

    );


    document
        .getElementById(
            "weaponName"
        )
        .textContent =

        weapons[
            currentWeapon
        ].name;


    document
        .querySelectorAll(
            ".weaponButton"
        )
        .forEach(

            button => {

                button.classList.toggle(

                    "active",

                    button.dataset.weapon ===
                    currentWeapon

                );

            }

        );


    updateHUD();

}


/* =====================================================
   COLLISION
===================================================== */

function checkCollision(

    position

) {

    const playerBox =
        new THREE.Box3();


    playerBox.setFromCenterAndSize(

        position,

        new THREE.Vector3(

            0.8,
            2,
            0.8

        )

    );


    for (
        let wall of walls
    ) {

        const wallBox =

            new THREE.Box3()
                .setFromObject(
                    wall
                );


        if (

            playerBox.intersectsBox(
                wallBox
            )

        ) {

            return true;

        }

    }


    return false;

}


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function movePlayer(delta) {

    if (
        gameOver
    )
        return;


    const speed =

        sprinting
        ? 10
        : 5;


    const forward =
        new THREE.Vector3(

            0,
            0,
            -1

        );


    const right =
        new THREE.Vector3(

            1,
            0,
            0

        );


    forward.applyQuaternion(

        player.quaternion

    );


    right.applyQuaternion(

        player.quaternion

    );


    forward.y =
        0;


    right.y =
        0;


    forward.normalize();

    right.normalize();


    const movement =
        new THREE.Vector3();


    movement.add(

        forward.multiplyScalar(

            -joyY

        )

    );


    movement.add(

        right.multiplyScalar(

            joyX

        )

    );


    if (

        movement.length() >
        0

    ) {

        movement.normalize();


        const move =

            movement.multiplyScalar(

                speed *
                delta

            );


        const testX =
            player.position.clone();


        testX.x +=
            move.x;


        if (
            !checkCollision(testX)
        ) {

            player.position.x =
                testX.x;

        }


        const testZ =
            player.position.clone();


        testZ.z +=
            move.z;


        if (
            !checkCollision(testZ)
        ) {

            player.position.z =
                testZ.z;

        }

    }

}


/* =====================================================
   PLAYER VELOCITY
===================================================== */

function updatePlayerVelocity(delta) {

    if (
        !playerVelocityInitialized
    ) {

        lastPlayerPosition.copy(
            player.position
        );


        playerVelocityInitialized =
            true;


        return;

    }


    if (
        delta <=
        0
    )
        return;


    playerVelocity
        .subVectors(

            player.position,

            lastPlayerPosition

        )
        .divideScalar(
            delta
        );


    lastPlayerPosition.copy(
        player.position
    );


    if (

        playerVelocity.length() >
        20

    ) {

        playerVelocity.setLength(
            20
        );

    }

}


/* =====================================================
   PLAYER SHOOT
===================================================== */

function shoot() {

    if (
        gameOver ||
        reloading
    )
        return;


    const weapon =
        weapons[
            currentWeapon
        ];


    const now =
        performance.now();


    if (

        now -
        lastShot <
        weapon.fireRate

    )
        return;


    if (
        weapon.ammo <=
        0
    ) {

        reload();

        return;

    }


    lastShot =
        now;


    weapon.ammo--;


    updateHUD();


    muzzleFlash.visible =
        true;


    setTimeout(

        function() {

            if (
                muzzleFlash
            ) {

                muzzleFlash.visible =
                    false;

            }

        },

        60

    );


    const raycaster =
        new THREE.Raycaster();


    raycaster.setFromCamera(

        new THREE.Vector2(

            0,
            0

        ),

        camera

    );


    const enemyParts = [];


    for (
        let enemy of enemies
    ) {

        if (
            !enemy.alive
        )
            continue;


        enemy.traverse(

            function(object) {

                if (
                    object.isMesh
                ) {

                    object.userData.enemy =
                        enemy;


                    enemyParts.push(
                        object
                    );

                }

            }

        );

    }


    const hits =

        raycaster.intersectObjects(

            enemyParts,

            false

        );


    if (
        hits.length ===
        0
    )
        return;


    const hitObject =
        hits[0].object;


    const enemy =
        hitObject
            .userData
            .enemy;


    if (
        !enemy ||
        !enemy.alive
    )
        return;


    let damage =
        weapon.damage;


    if (
        hitObject ===
        enemy.head
    ) {

        damage *=
            1.5;

    }


    damageEnemy(

        enemy,

        damage

    );

}


/* =====================================================
   DAMAGE ENEMY
===================================================== */

function damageEnemy(

    enemy,

    damage

) {

    if (
        !enemy.alive
    )
        return;


    enemy.health -=
        damage;


    showHitMarker();


    if (
        enemy.health <=
        0
    ) {

        killEnemy(
            enemy
        );

    }

}


/* =====================================================
   KILL ENEMY
===================================================== */

function killEnemy(
    enemy
) {

    enemy.alive =
        false;


    scene.remove(
        enemy
    );


    kills++;


    updateHUD();


    if (

        enemies.every(

            e =>
                !e.alive

        )

    ) {

        winGame();

    }

}


/* =====================================================
   RELOAD
===================================================== */

function reload() {

    const weapon =
        weapons[
            currentWeapon
        ];


    if (

        reloading ||

        weapon.ammo ===
        weapon.magazineSize ||

        weapon.reserve <=
        0

    )
        return;


    reloading =
        true;


    document
        .getElementById(
            "reload"
        )
        .textContent =
        "RELOADING";


    setTimeout(

        function() {

            const needed =

                weapon.magazineSize -
                weapon.ammo;


            const amount =

                Math.min(

                    needed,

                    weapon.reserve

                );


            weapon.ammo +=
                amount;


            weapon.reserve -=
                amount;


            reloading =
                false;


            document
                .getElementById(
                    "reload"
                )
                .textContent =
                "RELOAD";


            updateHUD();

        },

        1000

    );

}


/* =====================================================
   ENEMY AI
===================================================== */

function updateEnemies(delta) {

    if (
        gameOver
    )
        return;


    for (
        let enemy of enemies
    ) {

        if (
            !enemy.alive
        )
            continue;


        enemy.stateTimer +=
            delta;


        const direction =
            new THREE.Vector3();


        direction.subVectors(

            player.position,

            enemy.position

        );


        direction.y =
            0;


        const distance =
            direction.length();


        const detected =

            distance <=
            enemy.stats.detectionRange &&

            hasLineOfSight(
                enemy
            );


        if (
            detected
        ) {

            enemy.lastKnownPlayerPosition
                .copy(
                    player.position
                );


            if (

                enemy.state ===
                ENEMY_STATES.PATROL ||

                enemy.state ===
                ENEMY_STATES.SEARCH

            ) {

                setEnemyState(

                    enemy,

                    ENEMY_STATES.ALERT

                );

            }

        }


        if (

            enemy.state ===
            ENEMY_STATES.PATROL

        ) {

            patrolEnemy(

                enemy,

                delta

            );

        }


        else if (

            enemy.state ===
            ENEMY_STATES.ALERT

        ) {

            faceEnemyTarget(

                enemy,

                player.position

            );


            enemy.alertTimer -=
                delta;


            if (
                enemy.alertTimer <=
                0
            ) {

                setEnemyState(

                    enemy,

                    ENEMY_STATES.CHASE

                );

            }

        }


        else if (

            enemy.state ===
            ENEMY_STATES.CHASE

        ) {

            faceEnemyTarget(

                enemy,

                player.position

            );


            if (

                distance >
                enemy.preferredDistance

            ) {

                moveEnemyToward(

                    enemy,

                    player.position,

                    delta

                );

            }


            if (

                distance <=
                enemy.stats.attackRange

            ) {

                setEnemyState(

                    enemy,

                    ENEMY_STATES.ATTACK

                );

            }


            if (
                !detected
            ) {

                setEnemyState(

                    enemy,

                    ENEMY_STATES.SEARCH

                );

            }

        }


        else if (

            enemy.state ===
            ENEMY_STATES.ATTACK

        ) {

            faceEnemyTarget(

                enemy,

                player.position

            );


            if (

                distance >
                enemy.stats.attackRange

            ) {

                setEnemyState(

                    enemy,

                    ENEMY_STATES.CHASE

                );


                continue;

            }


            if (

                distance <
                enemy.stats.attackRange *
                0.45 &&

                enemy.type !==
                "heavy"

            ) {

                setEnemyState(

                    enemy,

                    ENEMY_STATES.RETREAT

                );


                continue;

            }


            enemy.shootTimer -=
                delta *
                1000;


            if (

                enemy.shootTimer <=
                0 &&

                hasLineOfSight(
                    enemy
                )

            ) {

                enemyShoot(
                    enemy
                );


                enemy.shootTimer =

                    enemy.stats.fireRate;

            }

        }


        else if (

            enemy.state ===
            ENEMY_STATES.RETREAT

        ) {

            faceEnemyTarget(

                enemy,

                player.position

            );


            moveEnemyAway(

                enemy,

                player.position,

                delta

            );


            if (

                distance >
                enemy.stats.attackRange *
                0.65

            ) {

                setEnemyState(

                    enemy,

                    ENEMY_STATES.ATTACK

                );

            }

        }


        else if (

            enemy.state ===
            ENEMY_STATES.SEARCH

        ) {

            faceEnemyTarget(

                enemy,

                enemy.lastKnownPlayerPosition

            );


            moveEnemyToward(

                enemy,

                enemy.lastKnownPlayerPosition,

                delta

            );


            enemy.searchTimer -=
                delta;


            if (
                detected
            ) {

                setEnemyState(

                    enemy,

                    ENEMY_STATES.CHASE

                );

            }


            if (

                enemy.searchTimer <=
                0

            ) {

                setEnemyState(

                    enemy,

                    ENEMY_STATES.PATROL

                );

            }

        }


        animateEnemy(

            enemy,

            delta

        );

    }

}


/* =====================================================
   STATE CHANGE
===================================================== */

function setEnemyState(

    enemy,

    newState

) {

    if (

        enemy.state ===
        newState

    )
        return;


    enemy.state =
        newState;


    enemy.stateTimer =
        0;


    if (

        newState ===
        ENEMY_STATES.SEARCH

    ) {

        enemy.searchTimer =
            5;

    }


    if (

        newState ===
        ENEMY_STATES.ALERT

    ) {

        enemy.alertTimer =
            1;

    }

}


/* =====================================================
   PATROL
===================================================== */

function choosePatrolTarget(
    enemy
) {

    const limit =
        110;


    enemy.patrolTarget.set(

        (
            Math.random() *
            2 -
            1
        ) *
        limit,

        0,

        (
            Math.random() *
            2 -
            1
        ) *
        limit

    );


    enemy.patrolTimer =
        5 +
        Math.random() *
        8;

}


function patrolEnemy(

    enemy,

    delta

) {

    enemy.patrolTimer -=
        delta;


    if (

        enemy.position.distanceTo(

            enemy.patrolTarget

        ) <

        2

    ) {

        choosePatrolTarget(
            enemy
        );

        return;

    }


    moveEnemyToward(

        enemy,

        enemy.patrolTarget,

        delta

    );


    faceEnemyTarget(

        enemy,

        enemy.patrolTarget

    );

}


/* =====================================================
   MOVE ENEMY
===================================================== */

function moveEnemyToward(

    enemy,

    target,

    delta

) {

    const direction =
        new THREE.Vector3();


    direction.subVectors(

        target,

        enemy.position

    );


    direction.y =
        0;


    if (
        direction.length() ===
        0
    )
        return;


    direction.normalize();


    const movement =

        direction.multiplyScalar(

            enemy.stats.speed *
            delta

        );


    const newPosition =
        enemy.position.clone();


    newPosition.add(
        movement
    );


    if (
        !checkEnemyWallCollision(
            newPosition
        )
    ) {

        enemy.position.copy(
            newPosition
        );

    }

}


function moveEnemyAway(

    enemy,

    target,

    delta

) {

    const direction =
        new THREE.Vector3();


    direction.subVectors(

        enemy.position,

        target

    );


    direction.y =
        0;


    if (
        direction.length() ===
        0
    )
        return;


    direction.normalize();


    const movement =

        direction.multiplyScalar(

            enemy.stats.speed *
            delta

        );


    const newPosition =
        enemy.position.clone();


    newPosition.add(
        movement
    );


    if (
        !checkEnemyWallCollision(
            newPosition
        )
    ) {

        enemy.position.copy(
            newPosition
        );

    }

}


/* =====================================================
   FACE TARGET
===================================================== */

function faceEnemyTarget(

    enemy,

    target

) {

    const direction =
        new THREE.Vector3();


    direction.subVectors(

        target,

        enemy.position

    );


    direction.y =
        0;


    if (
        direction.length() ===
        0
    )
        return;


    const targetRotation =

        Math.atan2(

            direction.x,

            direction.z

        );


    let difference =

        targetRotation -
        enemy.rotation.y;


    while (

        difference >
        Math.PI

    ) {

        difference -=
            Math.PI * 2;

    }


    while (

        difference <
        -Math.PI

    ) {

        difference +=
            Math.PI * 2;

    }


    enemy.rotation.y +=

        difference *
        0.12;

}


/* =====================================================
   ENEMY ANIMATION
===================================================== */

function animateEnemy(

    enemy,

    delta

) {

    const moving =

        enemy.state ===
        ENEMY_STATES.PATROL ||

        enemy.state ===
        ENEMY_STATES.CHASE ||

        enemy.state ===
        ENEMY_STATES.RETREAT ||

        enemy.state ===
        ENEMY_STATES.SEARCH;


    if (
        moving
    ) {

        enemy.walkTime +=

            delta *
            8;


        enemy.leftLeg.rotation.x =

            Math.sin(

                enemy.walkTime

            ) *
            0.5;


        enemy.rightLeg.rotation.x =

            Math.sin(

                enemy.walkTime +
                Math.PI

            ) *
            0.5;

    }

}


/* =====================================================
   ENEMY WALL COLLISION
===================================================== */

function checkEnemyWallCollision(

    position

) {

    const box =
        new THREE.Box3();


    box.setFromCenterAndSize(

        position,

        new THREE.Vector3(

            1.2,
            2.5,
            1.2

        )

    );


    for (
        let wall of walls
    ) {

        const wallBox =

            new THREE.Box3()
                .setFromObject(
                    wall
                );


        if (

            box.intersectsBox(
                wallBox
            )

        ) {

            return true;

        }

    }


    return false;

}


/* =====================================================
   LINE OF SIGHT
===================================================== */

function hasLineOfSight(

    enemy

) {

    const origin =
        enemy.position.clone();


    origin.y +=
        1.5;


    const target =
        player.position.clone();


    target.y +=
        0.5;


    const direction =
        new THREE.Vector3();


    direction.subVectors(

        target,

        origin

    );


    const distance =
        direction.length();


    direction.normalize();


    const raycaster =
        new THREE.Raycaster(

            origin,

            direction,

            0,

            distance

        );


    const hits =

        raycaster.intersectObjects(

            walls,

            false

        );


    return (
        hits.length ===
        0
    );

}


/* =====================================================
   ENEMY SHOOT
===================================================== */

function enemyShoot(

    enemy

) {

    if (
        gameOver ||
        !enemy.alive
    )
        return;


    enemy.muzzleFlash.visible =
        true;


    setTimeout(

        function() {

            if (
                enemy.muzzleFlash
            ) {

                enemy.muzzleFlash.visible =
                    false;

            }

        },

        80

    );


    const origin =
        new THREE.Vector3();


    enemy.muzzleFlash
        .getWorldPosition(
            origin
        );


    const distance =
        origin.distanceTo(
            player.position
        );


    let projectileSpeed =
        45;


    if (
        enemy.type ===
        "scout"
    )
        projectileSpeed =
            60;


    if (
        enemy.type ===
        "heavy"
    )
        projectileSpeed =
            32;


    const travelTime =

        distance /
        projectileSpeed;


    const predictedTarget =

        player.position.clone();


    predictedTarget.add(

        playerVelocity
            .clone()
            .multiplyScalar(
                travelTime
            )

    );


    const direction =
        new THREE.Vector3();


    direction.subVectors(

        predictedTarget,

        origin

    );


    const accuracy =
        enemy.stats.accuracy;


    direction.x +=

        (
            Math.random() -
            0.5
        ) *
        accuracy;


    direction.y +=

        (
            Math.random() -
            0.5
        ) *
        accuracy;


    direction.z +=

        (
            Math.random() -
            0.5
        ) *
        accuracy;


    direction.normalize();


    let projectileSize =
        0.12;


    let projectileColor =
        0xff0000;


    if (
        enemy.type ===
        "scout"
    ) {

        projectileSize =
            0.07;

        projectileColor =
            0x00ffff;

    }


    if (
        enemy.type ===
        "heavy"
    ) {

        projectileSize =
            0.25;

        projectileColor =
            0xff0000;

    }


    const projectile =
        new THREE.Mesh(

            new THREE.SphereGeometry(

                projectileSize,

                8,

                8

            ),

            new THREE.MeshBasicMaterial({

                color:
                    projectileColor

            })

        );


    projectile.position.copy(
        origin
    );


    projectile.velocity =

        direction
            .multiplyScalar(
                projectileSpeed
            );


    projectile.damage =
        enemy.stats.damage;


    projectile.life =
        5;


    projectile.isEnemyBullet =
        true;


    projectile.color =
        projectileColor;


    scene.add(
        projectile
    );


    bullets.push(
        projectile
    );

}


/* =====================================================
   BULLET UPDATE
===================================================== */

function updateEnemyBullets(delta) {

    for (

        let i =
            bullets.length - 1;

        i >= 0;

        i--

    ) {

        const bullet =
            bullets[i];


        const oldPosition =
            bullet.position.clone();


        bullet.position.add(

            bullet.velocity
                .clone()
                .multiplyScalar(
                    delta
                )

        );


        bullet.life -=
            delta;


        createProjectileTrail(

            oldPosition,

            bullet.position,

            bullet.color

        );


        const travelDirection =
            new THREE.Vector3()
                .subVectors(

                    bullet.position,

                    oldPosition

                );


        const travelDistance =
            travelDirection.length();


        travelDirection.normalize();


        const wallRay =
            new THREE.Raycaster(

                oldPosition,

                travelDirection,

                0,

                travelDistance

            );


        const wallHits =

            wallRay.intersectObjects(

                walls,

                false

            );


        if (
            wallHits.length > 0
        ) {

            createImpactEffect(

                wallHits[0].point,

                bullet.color

            );


            removeBullet(
                i
            );


            continue;

        }


        const playerRay =
            new THREE.Raycaster(

                oldPosition,

                travelDirection,

                0,

                travelDistance

            );


        const playerHits =

            playerRay.intersectObject(

                camera,

                true

            );


        if (
            playerHits.length > 0
        ) {

            createImpactEffect(

                playerHits[0].point,

                0xff0000

            );


            takeDamage(

                bullet.damage

            );


            removeBullet(
                i
            );


            continue;

        }


        if (

            bullet.position.distanceTo(

                player.position

            ) <

            1.2

        ) {

            takeDamage(

                bullet.damage

            );


            removeBullet(
                i
            );


            continue;

        }


        if (
            bullet.life <=
            0
        ) {

            removeBullet(
                i
            );

        }

    }

}


/* =====================================================
   BULLET REMOVE
===================================================== */

function removeBullet(
    index
) {

    const bullet =
        bullets[index];


    if (!bullet)
        return;


    scene.remove(
        bullet
    );


    bullets.splice(

        index,

        1

    );

}


/* =====================================================
   PROJECTILE TRAIL
===================================================== */

function createProjectileTrail(

    start,

    end,

    color

) {

    const direction =
        new THREE.Vector3()
            .subVectors(

                end,

                start

            );


    const length =
        direction.length();


    const geometry =
        new THREE.CylinderGeometry(

            0.025,

            0.025,

            length,

            6

        );


    const material =
        new THREE.MeshBasicMaterial({

            color:
                color,

            transparent:
                true,

            opacity:
                0.8

        });


    const trail =
        new THREE.Mesh(

            geometry,

            material

        );


    trail.position.copy(

        start

    );


    trail.position.add(

        end
            .clone()
            .sub(start)
            .multiplyScalar(
                0.5
            )

    );


    trail.quaternion.setFromUnitVectors(

        new THREE.Vector3(

            0,
            1,
            0

        ),

        direction.normalize()

    );


    trail.life =
        0.08;


    scene.add(
        trail
    );


    projectileEffects.push(
        trail
    );

}


/* =====================================================
   IMPACT
===================================================== */

function createImpactEffect(

    position,

    color

) {

    const effect =
        new THREE.Mesh(

            new THREE.SphereGeometry(

                0.15,

                8,

                8

            ),

            new THREE.MeshBasicMaterial({

                color:
                    color,

                transparent:
                    true

            })

        );


    effect.position.copy(
        position
    );


    effect.life =
        0.25;


    scene.add(
        effect
    );


    projectileEffects.push(
        effect
    );

}


/* =====================================================
   EFFECT UPDATE
===================================================== */

function updateProjectileEffects(delta) {

    for (

        let i =
            projectileEffects.length - 1;

        i >= 0;

        i--

    ) {

        const effect =
            projectileEffects[i];


        effect.life -=
            delta;


        if (
            effect.material
        ) {

            effect.material.opacity =

                Math.max(

                    0,

                    effect.life /
                    0.25

                );

        }


        if (

            effect.life <=
            0

        ) {

            scene.remove(
                effect
            );


            projectileEffects.splice(

                i,

                1

            );

        }

    }

}


/* =====================================================
   DAMAGE PLAYER
===================================================== */

function takeDamage(

    damage

) {

    if (
        gameOver
    )
        return;


    health -=
        damage;


    health =
        Math.max(

            0,

            health

        );


    updateHUD();


    const flash =
        document.getElementById(

            "damageFlash"

        );


    flash.style.opacity =
        1;


    setTimeout(

        function() {

            flash.style.opacity =
                0;

        },

        150

    );


    if (
        health <=
        0
    ) {

        loseGame();

    }

}


/* =====================================================
   HIT MARKER
===================================================== */

function showHitMarker() {

    const marker =
        document.getElementById(

            "hitMarker"

        );


    marker.style.opacity =
        1;


    setTimeout(

        function() {

            marker.style.opacity =
                0;

        },

        100

    );

}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    const weapon =
        weapons[
            currentWeapon
        ];


    document
        .getElementById(
            "ammo"
        )
        .textContent =

        weapon.ammo;


    document
        .getElementById(
            "reserve"
        )
        .textContent =

        weapon.reserve;


    document
        .getElementById(
            "kills"
        )
        .textContent =

        kills;


    document
        .getElementById(
            "enemyCount"
        )
        .textContent =

        enemies.filter(

            e =>
                e.alive

        ).length;


    document
        .getElementById(
            "health"
        )
        .style.width =

        health +
        "%";

}


/* =====================================================
   MINIMAP
===================================================== */

function updateMinimap() {

    const canvas =
        document.getElementById(

            "minimap"

        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(

        0,
        0,
        150,
        150

    );


    ctx.fillStyle =
        "#333";


    ctx.fillRect(

        0,
        0,
        150,
        150

    );


    const scale =
        150 /
        250;


    for (
        let enemy of enemies
    ) {

        if (
            !enemy.alive
        )
            continue;


        const x =

            75 +

            enemy.position.x *
            scale;


        const y =

            75 +

            enemy.position.z *
            scale;


        ctx.fillStyle =
            "red";


        ctx.beginPath();


        ctx.arc(

            x,
            y,
            4,
            0,
            Math.PI * 2

        );


        ctx.fill();

    }


    const playerX =

        75 +

        player.position.x *
        scale;


    const playerY =

        75 +

        player.position.z *
        scale;


    ctx.fillStyle =
        "lime";


    ctx.beginPath();


    ctx.arc(

        playerX,

        playerY,

        5,

        0,

        Math.PI * 2

    );


    ctx.fill();

}


/* =====================================================
   WIN / LOSE
===================================================== */

function winGame() {

    gameOver =
        true;


    document
        .getElementById(
            "messageText"
        )
        .textContent =

        "YOU WIN!";


    document
        .getElementById(
            "message"
        )
        .style.display =
        "block";

}


function loseGame() {

    gameOver =
        true;


    document
        .getElementById(
            "messageText"
        )
        .textContent =

        "GAME OVER";


    document
        .getElementById(
            "message"
        )
        .style.display =
        "block";

}


/* =====================================================
   RESIZE
===================================================== */

function resize() {

    camera.aspect =

        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


/* =====================================================
   GAME LOOP
===================================================== */

let lastTime =
    performance.now();


function animate() {

    requestAnimationFrame(
        animate
    );


    const now =
        performance.now();


    let delta =

        (
            now -
            lastTime
        ) /
        1000;


    lastTime =
        now;


    delta =
        Math.min(

            delta,

            0.1

        );


    movePlayer(
        delta
    );


    updatePlayerVelocity(
        delta
    );


    updateEnemies(
        delta
    );


    updateEnemyBullets(
        delta
    );


    updateProjectileEffects(
        delta
    );


    updateMinimap();


    renderer.render(

        scene,

        camera

    );

}


/* =====================================================
   START
===================================================== */

startGame();

</script>
