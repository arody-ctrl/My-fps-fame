<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #87CEEB;

    touch-action: none;

    font-family: Arial, sans-serif;

}

canvas {

    display: block;

}


/* =========================
   HUD
========================= */

#hud {

    position: fixed;

    top: 15px;
    left: 15px;

    color: white;

    font-size: 16px;

    font-weight: bold;

    text-shadow:
        2px 2px 4px black;

    z-index: 20;

}

#healthBar {

    width: 180px;

    height: 20px;

    margin-top: 4px;

    border: 2px solid white;

    background: #333;

}

#health {

    width: 100%;

    height: 100%;

    background: lime;

    transition: width 0.2s;

}

.stat {

    margin-top: 5px;

}


/* =========================
   WEAPON
========================= */

#weaponName {

    color: yellow;

}


/* =========================
   CROSSHAIR
========================= */

#crosshair {

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-size: 30px;

    font-weight: bold;

    text-shadow:
        2px 2px 5px black;

    pointer-events: none;

    z-index: 10;

}


/* =========================
   HIT MARKER
========================= */

#hitMarker {

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-size: 35px;

    font-weight: bold;

    opacity: 0;

    pointer-events: none;

    z-index: 15;

}


/* =========================
   DAMAGE FLASH
========================= */

#damageFlash {

    position: fixed;

    inset: 0;

    background:
        rgba(255,0,0,0.3);

    opacity: 0;

    pointer-events: none;

    z-index: 14;

}


/* =========================
   JOYSTICK
========================= */

#joystick {

    position: fixed;

    left: 25px;

    bottom: 30px;

    width: 130px;

    height: 130px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.2);

    border:
        3px solid
        rgba(255,255,255,0.5);

    z-index: 30;

}

#stick {

    position: absolute;

    width: 50px;

    height: 50px;

    left: 40px;

    top: 40px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.7);

}


/* =========================
   FIRE
========================= */

#fire {

    position: fixed;

    right: 25px;

    bottom: 35px;

    width: 90px;

    height: 90px;

    border-radius: 50%;

    background: red;

    color: white;

    border:
        3px solid white;

    font-size: 17px;

    font-weight: bold;

    z-index: 30;

}


/* =========================
   RELOAD
========================= */

#reload {

    position: fixed;

    right: 35px;

    bottom: 145px;

    width: 80px;

    height: 45px;

    border-radius: 8px;

    background: black;

    color: white;

    border:
        2px solid white;

    z-index: 30;

}


/* =========================
   WEAPON SWITCH
========================= */

#switchWeapon {

    position: fixed;

    right: 125px;

    bottom: 155px;

    width: 110px;

    height: 45px;

    border-radius: 8px;

    background: #222;

    color: white;

    border:
        2px solid white;

    font-size: 12px;

    z-index: 30;

}


/* =========================
   SPRINT
========================= */

#sprint {

    position: fixed;

    left: 170px;

    bottom: 45px;

    width: 75px;

    height: 55px;

    border-radius: 12px;

    background:
        rgba(0,0,0,0.7);

    color: white;

    border:
        2px solid white;

    font-weight: bold;

    z-index: 30;

}


/* =========================
   MINIMAP
========================= */

#minimap {

    position: fixed;

    top: 15px;

    right: 15px;

    width: 150px;

    height: 150px;

    background:
        rgba(0,0,0,0.65);

    border:
        2px solid white;

    z-index: 25;

}


/* =========================
   GAME OVER
========================= */

#message {

    position: fixed;

    top: 50%;

    left: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-size: 38px;

    font-weight: bold;

    text-align: center;

    text-shadow:
        3px 3px 7px black;

    z-index: 100;

    display: none;

}

#restart {

    margin-top: 20px;

    padding:
        12px 25px;

    background: black;

    color: white;

    border:
        2px solid white;

    border-radius: 8px;

    font-size: 18px;

}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>


// =====================================================
// GAME VARIABLES
// =====================================================

let scene;

let camera;

let renderer;

let player;

let gun;

let muzzleFlash;

let enemies = [];

let walls = [];

let health = 100;

let kills = 0;

let gameOver = false;

let sprinting = false;

let reloading = false;

let lastShot = 0;

let weaponIndex = 0;


// =====================================================
// WEAPONS
// =====================================================

const weapons = [

    {

        name: "PISTOL",

        damage: 35,

        fireRate: 300,

        magazine: 12,

        ammo: 12,

        reserve: 120,

        reloadTime: 900,

        spread: 0.015

    },

    {

        name: "SMG",

        damage: 18,

        fireRate: 90,

        magazine: 30,

        ammo: 30,

        reserve: 180,

        reloadTime: 1200,

        spread: 0.04

    },

    {

        name: "ASSAULT RIFLE",

        damage: 28,

        fireRate: 140,

        magazine: 30,

        ammo: 30,

        reserve: 180,

        reloadTime: 1300,

        spread: 0.025

    },

    {

        name: "SNIPER",

        damage: 100,

        fireRate: 900,

        magazine: 5,

        ammo: 5,

        reserve: 40,

        reloadTime: 1700,

        spread: 0.003

    }

];


// =====================================================
// CONTROLS
// =====================================================

let joyX = 0;

let joyY = 0;

let joystickTouch = null;

let aimTouch = null;

let lastAimX = 0;

let lastAimY = 0;

let rotationY = 0;

let rotationX = 0;


// =====================================================
// START GAME
// =====================================================

function startGame() {


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(

            0x87CEEB

        );


    camera =
        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /
            window.innerHeight,

            0.1,

            1000

        );


    renderer =
        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    document.body.appendChild(

        renderer.domElement

    );


    const light =

        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            2

        );


    scene.add(light);


    player =
        new THREE.Object3D();


    player.position.set(

        0,

        1.7,

        40

    );


    scene.add(player);


    player.add(camera);


    createGround();

    createMap();

    createGun();

    spawnEnemies();

    setupControls();


    window.addEventListener(

        "resize",

        resize

    );


    updateHUD();


    animate();

}


// =====================================================
// GROUND
// =====================================================

function createGround() {


    const geometry =

        new THREE.PlaneGeometry(

            100,

            100

        );


    const material =

        new THREE.MeshBasicMaterial({

            color:
                0x228B22

        });


    const ground =

        new THREE.Mesh(

            geometry,

            material

        );


    ground.rotation.x =

        -Math.PI / 2;


    scene.add(ground);

}


// =====================================================
// WALL
// =====================================================

function createWall(

    x,

    z,

    width,

    depth,

    height = 4

) {


    const geometry =

        new THREE.BoxGeometry(

            width,

            height,

            depth

        );


    const material =

        new THREE.MeshBasicMaterial({

            color:
                0x777777

        });


    const wall =

        new THREE.Mesh(

            geometry,

            material

        );


    wall.position.set(

        x,

        height / 2,

        z

    );


    scene.add(wall);


    walls.push(wall);


}


// =====================================================
// LARGE MAP
// =====================================================

function createMap() {


    createWall(

        0,

        -50,

        100,

        2

    );


    createWall(

        0,

        50,

        100,

        2

    );


    createWall(

        -50,

        0,

        2,

        100

    );


    createWall(

        50,

        0,

        2,

        100

    );


    // Large cover structures

    createWall(

        -20,

        0,

        4,

        25

    );


    createWall(

        20,

        0,

        4,

        25

    );


    createWall(

        0,

        -20,

        25,

        4

    );


    createWall(

        0,

        20,

        25,

        4

    );


    createWall(

        -30,

        -30,

        8,

        8

    );


    createWall(

        30,

        -30,

        8,

        8

    );


    createWall(

        -30,

        30,

        8,

        8

    );


    createWall(

        30,

        30,

        8,

        8

    );

}


// =====================================================
// CREATE GUN
// =====================================================

function createGun() {


    gun =
        new THREE.Group();


    gun.position.set(

        0.35,

        -0.3,

        -0.8

    );


    camera.add(gun);


    buildGun();

}


// =====================================================
// BUILD WEAPON MODEL
// =====================================================

function buildGun() {


    while (

        gun.children.length > 0

    ) {


        gun.remove(

            gun.children[0]

        );

    }


    const material =

        new THREE.MeshBasicMaterial({

            color:
                0x222222

        });


    const weapon =

        weapons[weaponIndex];


    let body;

    let barrel;


    if (

        weapon.name ===
        "PISTOL"

    ) {


        body =

            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.25,

                    0.25,

                    0.65

                ),

                material

            );


        barrel =

            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.045,

                    0.045,

                    0.4,

                    10

                ),

                material

            );

    }


    else if (

        weapon.name ===
        "SMG"

    ) {


        body =

            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.3,

                    0.35,

                    0.8

                ),

                material

            );


        barrel =

            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.055,

                    0.055,

                    0.65,

                    10

                ),

                material

            );

    }


    else if (

        weapon.name ===
        "ASSAULT RIFLE"

    ) {


        body =

            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.3,

                    0.35,

                    1.1

                ),

                material

            );


        barrel =

            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.05,

                    0.05,

                    0.9,

                    10

                ),

                material

            );

    }


    else {


        body =

            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.3,

                    0.3,

                    1.5

                ),

                material

            );


        barrel =

            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.045,

                    0.045,

                    1.3,

                    10

                ),

                material

            );

    }


    gun.add(body);


    barrel.rotation.x =

        Math.PI / 2;


    barrel.position.z =

        -0.7;


    gun.add(barrel);


    muzzleFlash =

        new THREE.Mesh(

            new THREE.SphereGeometry(

                0.15,

                8,

                8

            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xffff00

            })

        );


    muzzleFlash.position.z =

        -1.4;


    muzzleFlash.visible =

        false;


    gun.add(

        muzzleFlash

    );

}


// =====================================================
// SPAWN ENEMIES
// =====================================================

function spawnEnemies() {


    const positions = [

        [-40,-40],

        [-20,-35],

        [0,-40],

        [20,-35],

        [40,-40],

        [-40,-10],

        [40,-10],

        [-40,10],

        [40,10],

        [-40,40],

        [0,40],

        [40,40]

    ];


    for (

        let pos of positions

    ) {


        createEnemy(

            pos[0],

            pos[1]

        );

    }

}


// =====================================================
// ROBOT ENEMY
// =====================================================

function createEnemy(

    x,

    z

) {


    const robot =

        new THREE.Group();


    robot.position.set(

        x,

        0,

        z

    );


    const redMaterial =

        new THREE.MeshBasicMaterial({

            color:
                0xff3333

        });


    const darkMaterial =

        new THREE.MeshBasicMaterial({

            color:
                0x222222

        });


    // Body

    const body =

        new THREE.Mesh(

            new THREE.BoxGeometry(

                1.5,

                1.8,

                1.2

            ),

            redMaterial

        );


    body.position.y =

        1.8;


    robot.add(body);


    // Head

    const head =

        new THREE.Mesh(

            new THREE.BoxGeometry(

                1.1,

                0.9,

                1

            ),

            darkMaterial

        );


    head.position.y =

        3.15;


    robot.add(head);


    // Eyes

    const eyeMaterial =

        new THREE.MeshBasicMaterial({

            color:
                0xffff00

        });


    const eye1 =

        new THREE.Mesh(

            new THREE.BoxGeometry(

                0.2,

                0.2,

                0.1

            ),

            eyeMaterial

        );


    eye1.position.set(

        -0.25,

        3.2,

        -0.52

    );


    robot.add(eye1);


    const eye2 =

        eye1.clone();


    eye2.position.x =

        0.25;


    robot.add(eye2);


    // Legs

    const leg1 =

        new THREE.Mesh(

            new THREE.BoxGeometry(

                0.35,

                1.2,

                0.35

            ),

            darkMaterial

        );


    leg1.position.set(

        -0.45,

        0.6,

        0

    );


    robot.add(leg1);


    const leg2 =

        leg1.clone();


    leg2.position.x =

        0.45;


    robot.add(leg2);


    // Gun

    const robotGun =

        new THREE.Mesh(

            new THREE.BoxGeometry(

                0.3,

                0.3,

                1.2

            ),

            darkMaterial

        );


    robotGun.position.set(

        0,

        1.8,

        -0.9

    );


    robot.add(robotGun);


    robot.health = 100;

    robot.alive = true;

    robot.shootTimer =

        Math.random() * 2;


    robot.speed =

        1.5 +
        Math.random() * 1.2;


    robot.detectionRange =

        70;


    robot.hitRadius =

        2.2;


    scene.add(robot);


    enemies.push(robot);

}


// =====================================================
// CONTROLS
// =====================================================

function setupControls() {


    const joystick =

        document.getElementById(

            "joystick"

        );


    const stick =

        document.getElementById(

            "stick"

        );


    joystick.addEventListener(

        "touchstart",

        function(e) {


            e.preventDefault();


            joystickTouch =

                e.changedTouches[0]
                .identifier;

        },

        {

            passive:false

        }

    );


    joystick.addEventListener(

        "touchmove",

        function(e) {


            e.preventDefault();


            let touch =

                [...e.touches].find(

                    t =>

                    t.identifier ===
                    joystickTouch

                );


            if (!touch)
                return;


            const rect =

                joystick.getBoundingClientRect();


            let x =

                touch.clientX -

                (

                    rect.left +
                    rect.width / 2

                );


            let y =

                touch.clientY -

                (

                    rect.top +
                    rect.height / 2

                );


            let max = 40;


            let distance =

                Math.sqrt(

                    x*x +
                    y*y

                );


            if (

                distance > max

            ) {


                x =

                    x /
                    distance *
                    max;


                y =

                    y /
                    distance *
                    max;

            }


            joyX =

                x / max;


            joyY =

                y / max;


            stick.style.transform =

                `translate(${x}px,${y}px)`;

        },

        {

            passive:false

        }

    );


    joystick.addEventListener(

        "touchend",

        function() {


            joystickTouch = null;

            joyX = 0;

            joyY = 0;


            stick.style.transform =

                "translate(0,0)";

        }

    );


    // Aim

    renderer.domElement.addEventListener(

        "touchstart",

        function(e) {


            for (

                let touch of
                e.changedTouches

            ) {


                if (

                    touch.clientX >
                    window.innerWidth / 2

                ) {


                    aimTouch =

                        touch.identifier;


                    lastAimX =

                        touch.clientX;


                    lastAimY =

                        touch.clientY;

                }

            }

        }

    );


    renderer.domElement.addEventListener(

        "touchmove",

        function(e) {


            for (

                let touch of
                e.changedTouches

            ) {


                if (

                    touch.identifier ===
                    aimTouch

                ) {


                    let dx =

                        touch.clientX -
                        lastAimX;


                    let dy =

                        touch.clientY -
                        lastAimY;


                    rotationY -=

                        dx * 0.004;


                    rotationX -=

                        dy * 0.004;


                    rotationX =

                        Math.max(

                            -1.3,

                            Math.min(

                                1.3,

                                rotationX

                            )

                        );


                    player.rotation.y =

                        rotationY;


                    camera.rotation.x =

                        rotationX;


                    lastAimX =

                        touch.clientX;


                    lastAimY =

                        touch.clientY;

                }

            }

        }

    );


    renderer.domElement.addEventListener(

        "touchend",

        function(e) {


            for (

                let touch of
                e.changedTouches

            ) {


                if (

                    touch.identifier ===
                    aimTouch

                ) {


                    aimTouch = null;

                }

            }

        }

    );


    document
        .getElementById("fire")
        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                shoot();

            },

            {

                passive:false

            }

        );


    document
        .getElementById("reload")
        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                reload();

            },

            {

                passive:false

            }

        );


    document
        .getElementById("switchWeapon")
        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                switchWeapon();

            },

            {

                passive:false

            }

        );


    const sprintButton =

        document.getElementById(

            "sprint"

        );


    sprintButton.addEventListener(

        "touchstart",

        function(e) {


            e.preventDefault();


            sprinting = true;

        },

        {

            passive:false

        }

    );


    sprintButton.addEventListener(

        "touchend",

        function() {


            sprinting = false;

        }

    );


    document
        .getElementById("restart")
        .addEventListener(

            "click",

            function() {


                location.reload();

            }

        );

}


// =====================================================
// SWITCH WEAPON
// =====================================================

function switchWeapon() {


    if (reloading)
        return;


    weaponIndex++;


    if (

        weaponIndex >=
        weapons.length

    ) {


        weaponIndex = 0;

    }


    buildGun();


    updateHUD();

}


// =====================================================
// COLLISION
// =====================================================

function checkCollision(

    position

) {


    const playerBox =

        new THREE.Box3();


    playerBox.setFromCenterAndSize(

        position,

        new THREE.Vector3(

            1,

            2,

            1

        )

    );


    for (

        let wall of walls

    ) {


        const wallBox =

            new THREE.Box3()
            .setFromObject(wall);


        if (

            playerBox.intersectsBox(

                wallBox

            )

        ) {


            return true;

        }

    }


    return false;

}


// =====================================================
// MOVEMENT
// =====================================================

function movePlayer(

    delta

) {


    if (gameOver)
        return;


    let speed =

        sprinting
        ? 11
        : 6;


    let forward =

        new THREE.Vector3(

            0,
            0,
            -1

        );


    let right =

        new THREE.Vector3(

            1,
            0,
            0

        );


    forward.applyQuaternion(

        player.quaternion

    );


    right.applyQuaternion(

        player.quaternion

    );


    forward.y = 0;

    right.y = 0;


    forward.normalize();

    right.normalize();


    let movement =

        new THREE.Vector3();


    movement.add(

        forward.multiplyScalar(

            -joyY

        )

    );


    movement.add(

        right.multiplyScalar(

            joyX

        )

    );


    if (

        movement.length() > 0

    ) {


        movement.normalize();


        let move =

            movement.multiplyScalar(

                speed *
                delta

            );


        let testX =

            player.position.clone();


        testX.x += move.x;


        if (

            !checkCollision(testX)

        ) {


            player.position.x =

                testX.x;

        }


        let testZ =

            player.position.clone();


        testZ.z += move.z;


        if (

            !checkCollision(testZ)

        ) {


            player.position.z =

                testZ.z;

        }

    }

}


// =====================================================
// SHOOT
// =====================================================

function shoot() {


    if (

        gameOver ||
        reloading

    )
        return;


    const weapon =

        weapons[weaponIndex];


    const now =

        performance.now();


    if (

        now -
        lastShot <
        weapon.fireRate

    )
        return;


    lastShot = now;


    if (

        weapon.ammo <= 0

    ) {


        reload();


        return;

    }


    weapon.ammo--;


    updateHUD();


    muzzleFlash.visible = true;


    setTimeout(

        function() {


            muzzleFlash.visible = false;


        },

        60

    );


    // Bullet direction

    const direction =

        new THREE.Vector3(

            0,
            0,
            -1

        );


    direction.applyQuaternion(

        camera.quaternion

    );


    // Mobile aim forgiveness

    direction.x +=

        (

            Math.random() -
            0.5

        ) *

        weapon.spread;


    direction.y +=

        (

            Math.random() -
            0.5

        ) *

        weapon.spread;


    direction.z +=

        (

            Math.random() -
            0.5

        ) *

        weapon.spread;


    direction.normalize();


    const origin =

        new THREE.Vector3();


    camera.getWorldPosition(

        origin

    );


    const raycaster =

        new THREE.Raycaster(

            origin,

            direction,

            0,

            150

        );


    // Larger hit detection

    let closestEnemy = null;

    let closestDistance = Infinity;


    for (

        let enemy of enemies

    ) {


        if (!enemy.alive)
            continue;


        const enemyCenter =

            new THREE.Vector3(

                enemy.position.x,

                1.8,

                enemy.position.z

            );


        const toEnemy =

            enemyCenter.clone()
            .sub(origin);


        const distance =

            toEnemy.length();


        const projection =

            toEnemy.dot(direction);


        if (

            projection < 0

        )
            continue;


        const closestPoint =

            origin.clone()
            .add(

                direction.clone()
                .multiplyScalar(

                    projection

                )

            );


        const missDistance =

            closestPoint.distanceTo(

                enemyCenter

            );


        // LARGE HITBOX

        if (

            missDistance <
            enemy.hitRadius

        ) {


            if (

                distance <
                closestDistance

            ) {


                closestEnemy = enemy;

                closestDistance =

                    distance;

            }

        }

    }


    // Wall blocking

    const wallHits =

        raycaster.intersectObjects(

            walls

        );


    if (

        wallHits.length > 0 &&
        closestEnemy

    ) {


        if (

            wallHits[0].distance <
            closestDistance

        ) {


            closestEnemy = null;

        }

    }


    if (

        closestEnemy

    ) {


        closestEnemy.health -=

            weapon.damage;


        showHitMarker();


        if (

            closestEnemy.health <= 0

        ) {


            killEnemy(

                closestEnemy

            );

        }

    }


    createTracer(

        origin,

        direction,

        closestEnemy

    );

}


// =====================================================
// BULLET TRACER
// =====================================================

function createTracer(

    origin,

    direction,

    enemy

) {


    let distance = 50;


    if (enemy) {


        distance =

            origin.distanceTo(

                enemy.position

            );

    }


    const end =

        origin.clone()
        .add(

            direction.clone()
            .multiplyScalar(

                distance

            )

        );


    const geometry =

        new THREE.BufferGeometry()
        .setFromPoints([

            origin,
            end

        ]);


    const material =

        new THREE.LineBasicMaterial({

            color:
                0xffff00

        });


    const line =

        new THREE.Line(

            geometry,

            material

        );


    scene.add(line);


    setTimeout(

        function() {


            scene.remove(line);


        },

        50

    );

}


// =====================================================
// KILL ENEMY
// =====================================================

function killEnemy(

    enemy

) {


    enemy.alive = false;


    scene.remove(enemy);


    kills++;


    updateHUD();


    if (

        enemies.every(

            e => !e.alive

        )

    ) {


        winGame();

    }

}


// =====================================================
// RELOAD
// =====================================================

function reload() {


    const weapon =

        weapons[weaponIndex];


    if (

        reloading ||
        weapon.ammo ===
        weapon.magazine ||
        weapon.reserve <= 0

    )
        return;


    reloading = true;


    document
        .getElementById("reload")
        .textContent =

        "RELOADING";


    setTimeout(

        function() {


            let needed =

                weapon.magazine -
                weapon.ammo;


            let amount =

                Math.min(

                    needed,

                    weapon.reserve

                );


            weapon.ammo += amount;


            weapon.reserve -= amount;


            reloading = false;


            document
                .getElementById("reload")
                .textContent =

                "RELOAD";


            updateHUD();

        },

        weapon.reloadTime

    );

}


// =====================================================
// ENEMY AI
// =====================================================

function updateEnemies(

    delta

) {


    if (gameOver)
        return;


    for (

        let enemy of enemies

    ) {


        if (!enemy.alive)
            continue;


        const playerTarget =

            new THREE.Vector3(

                player.position.x,

                1.8,

                player.position.z

            );


        const enemyTarget =

            new THREE.Vector3(

                enemy.position.x,

                1.8,

                enemy.position.z

            );


        let direction =

            new THREE.Vector3();


        direction.subVectors(

            playerTarget,

            enemyTarget

        );


        direction.y = 0;


        const distance =

            direction.length();


        // Detection range

        if (

            distance >
            enemy.detectionRange

        )
            continue;


        // Face player

        const angle =

            Math.atan2(

                direction.x,

                direction.z

            );


        enemy.rotation.y =

            angle;


        // Move toward player

        if (

            distance > 10

        ) {


            direction.normalize();


            const movement =

                direction.multiplyScalar(

                    enemy.speed *
                    delta

                );


            const test =

                enemy.position.clone();


            test.x += movement.x;

            test.z += movement.z;


            if (

                !checkEnemyCollision(

                    test

                )

            ) {


                enemy.position.copy(

                    test

                );

            }

        }


        enemy.shootTimer -=

            delta;


        if (

            distance < 60 &&
            enemy.shootTimer <= 0

        ) {


            enemy.shootTimer =

                1.2 +
                Math.random() * 1.5;


            enemyShoot(

                enemy

            );

        }

    }

}


// =====================================================
// ENEMY SHOOTING
// =====================================================

function enemyShoot(

    enemy

) {


    if (gameOver)
        return;


    const enemyPosition =

        new THREE.Vector3(

            enemy.position.x,

            1.8,

            enemy.position.z

        );


    // Predict player movement

    const predictedTarget =

        player.position.clone();


    const prediction =

        new THREE.Vector3(

            joyX,
            0,
            -joyY

        );


    prediction.applyQuaternion(

        player.quaternion

    );


    predictedTarget.add(

        prediction.multiplyScalar(

            2.0

        )

    );


    predictedTarget.y =

        1.7;


    const direction =

        new THREE.Vector3();


    direction.subVectors(

        predictedTarget,

        enemyPosition

    );


    direction.normalize();


    // Aim error

    direction.x +=

        (

            Math.random() -
            0.5

        ) *
        0.025;


    direction.y +=

        (

            Math.random() -
            0.5

        ) *
        0.025;


    direction.z +=

        (

            Math.random() -
            0.5

        ) *
        0.025;


    direction.normalize();


    const raycaster =

        new THREE.Raycaster(

            enemyPosition,

            direction,

            0,

            100

        );


    const wallHits =

        raycaster.intersectObjects(

            walls

        );


    const playerDistance =

        enemyPosition.distanceTo(

            predictedTarget

        );


    if (

        wallHits.length > 0 &&

        wallHits[0].distance <
        playerDistance

    ) {


        return;

    }


    const playerHitRadius = 1.5;


    const closestPoint =

        enemyPosition.clone()
        .add(

            direction.clone()
            .multiplyScalar(

                playerDistance

            )

        );


    const missDistance =

        closestPoint.distanceTo(

            predictedTarget

        );


    if (

        missDistance <=
        playerHitRadius

    ) {


        takeDamage(

            8

        );

    }


    createEnemyTracer(

        enemyPosition,

        direction

    );

}


// =====================================================
// ENEMY BULLET TRACER
// =====================================================

function createEnemyTracer(

    origin,

    direction

) {


    const end =

        origin.clone()
        .add(

            direction.clone()
            .multiplyScalar(

                30

            )

        );


    const geometry =

        new THREE.BufferGeometry()
        .setFromPoints([

            origin,
            end

        ]);


    const material =

        new THREE.LineBasicMaterial({

            color:
                0xff0000

        });


    const line =

        new THREE.Line(

            geometry,

            material

        );


    scene.add(line);


    setTimeout(

        function() {


            scene.remove(line);


        },

        70

    );

}


// =====================================================
// ENEMY COLLISION
// =====================================================

function checkEnemyCollision(

    position

) {


    const box =

        new THREE.Box3();


    box.setFromCenterAndSize(

        new THREE.Vector3(

            position.x,

            1.5,

            position.z

        ),

        new THREE.Vector3(

            1.5,

            3,

            1.5

        )

    );


    for (

        let wall of walls

    ) {


        const wallBox =

            new THREE.Box3()
            .setFromObject(wall);


        if (

            box.intersectsBox(

                wallBox

            )

        ) {


            return true;

        }

    }


    return false;

}


// =====================================================
// DAMAGE
// =====================================================

function takeDamage(

    damage

) {


    if (gameOver)
        return;


    health -= damage;


    health =

        Math.max(

            0,

            health

        );


    updateHUD();


    const flash =

        document.getElementById(

            "damageFlash"

        );


    flash.style.opacity = 1;


    setTimeout(

        function() {


            flash.style.opacity = 0;


        },

        150

    );


    if (

        health <= 0

    ) {


        loseGame();

    }

}


// =====================================================
// HIT MARKER
// =====================================================

function showHitMarker() {


    const marker =

        document.getElementById(

            "hitMarker"

        );


    marker.style.opacity = 1;


    setTimeout(

        function() {


            marker.style.opacity = 0;


        },

        100

    );

}


// =====================================================
// HUD
// =====================================================

function updateHUD() {


    const weapon =

        weapons[weaponIndex];


    document
        .getElementById("weaponName")
        .textContent =

        weapon.name;


    document
        .getElementById("ammo")
        .textContent =

        weapon.ammo;


    document
        .getElementById("reserve")
        .textContent =

        weapon.reserve;


    document
        .getElementById("kills")
        .textContent =

        kills;


    document
        .getElementById("enemyCount")
        .textContent =

        enemies.filter(

            e => e.alive

        ).length;


    document
        .getElementById("health")
        .style.width =

        health + "%";

}


// =====================================================
// MINIMAP
// =====================================================

function updateMinimap() {


    const canvas =

        document.getElementById(

            "minimap"

        );


    const ctx =

        canvas.getContext(

            "2d"

        );


    ctx.clearRect(

        0,
        0,
        150,
        150

    );


    ctx.fillStyle =

        "#333";


    ctx.fillRect(

        0,
        0,
        150,
        150

    );


    ctx.strokeStyle =

        "#555";


    for (

        let i = 0;

        i <= 150;

        i += 25

    ) {


        ctx.beginPath();


        ctx.moveTo(

            i,
            0

        );


        ctx.lineTo(

            i,
            150

        );


        ctx.stroke();


        ctx.beginPath();


        ctx.moveTo(

            0,
            i

        );


        ctx.lineTo(

            150,
            i

        );


        ctx.stroke();

    }


    // Enemies

    for (

        let enemy of enemies

    ) {


        if (!enemy.alive)
            continue;


        let x =

            75 +
            enemy.position.x *
            1.5;


        let y =

            75 +
            enemy.position.z *
            1.5;


        ctx.fillStyle =

            "red";


        ctx.beginPath();


        ctx.arc(

            x,
            y,
            5,
            0,
            Math.PI * 2

        );


        ctx.fill();

    }


    // Player

    ctx.fillStyle =

        "lime";


    ctx.beginPath();


    ctx.arc(

        75 +
        player.position.x *
        1.5,

        75 +
        player.position.z *
        1.5,

        5,

        0,

        Math.PI * 2

    );


    ctx.fill();

}


// =====================================================
// WIN
// =====================================================

function winGame() {


    gameOver = true;


    document
        .getElementById(
            "messageText"
        )
        .textContent =

        "YOU WIN!";


    document
        .getElementById(
            "message"
        )
        .style.display =

        "block";

}


// =====================================================
// LOSE
// =====================================================

function loseGame() {


    gameOver = true;


    document
        .getElementById(
            "messageText"
        )
        .textContent =

        "GAME OVER";


    document
        .getElementById(
            "message"
        )
        .style.display =

        "block";

}


// =====================================================
// RESIZE
// =====================================================

function resize() {


    camera.aspect =

        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


// =====================================================
// GAME LOOP
// =====================================================

let lastTime =

    performance.now();


function animate() {


    requestAnimationFrame(

        animate

    );


    let now =

        performance.now();


    let delta =

        (

            now -
            lastTime

        ) / 1000;


    lastTime = now;


    delta =

        Math.min(

            delta,

            0.1

        );


    movePlayer(

        delta

    );


    updateEnemies(

        delta

    );


    updateMinimap();


    renderer.render(

        scene,

        camera

    );

}


// =====================================================
// START
// =====================================================

startGame();


</script>
